<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORID 專案工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#EDF1F5;--s:#FFFFFF;--s2:#F4F7FA;--fg:#1E2B38;--mu:#5A6B7B;--ln:#D3DCE5;--pri:#4E7396;--pd:#34526F;--ps:#DDE7F0;--acc:#D9822B;--as:#FBECDC;--good:#3C8A68;--bad:#C0504A;--warn:#B07A1F;--badbg:#F9E3E1;--warnbg:#F8EDD3;--goodbg:#DDEFE6;
--c-P:#34526F;--c-I:#66788A;--c-Q:#7B8794;--c-EM:#2F8F83;--c-J:#7566A8;--c-PN:#C0504A;--c-IN:#4E7396;--c-OP:#2F8F83;--c-ID:#7566A8;--c-HY:#A9812A;--c-GN:#4F9A62;--c-SV:#A25C86;
--sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--serif:'Noto Serif TC','Songti TC',serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--onpd:#fff;--sticky:#F6E9A8;--sh:0 1px 2px rgba(30,43,56,.06),0 6px 18px rgba(30,43,56,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A23;--s:#19232E;--s2:#1F2B37;--fg:#E4EBF2;--mu:#9AAABB;--ln:#2D3B49;--pri:#8DB1D0;--pd:#A9C6DE;--ps:#24384A;--acc:#EBA05A;--as:#3A2C1D;--good:#6CC49A;--bad:#E58A82;--warn:#D8B35D;--badbg:#412826;--warnbg:#3C3020;--goodbg:#20392E;
--c-P:#9DB9D3;--c-I:#9AA9B8;--c-Q:#A5AFBA;--c-EM:#5FC0B3;--c-J:#A99BD8;--c-PN:#E58A82;--c-IN:#8DB1D0;--c-OP:#5FC0B3;--c-ID:#A99BD8;--c-HY:#D8B35D;--c-GN:#84C494;--c-SV:#D58BB5;--onpd:#111A23;--sticky:#D9C978;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111A23;--s:#19232E;--s2:#1F2B37;--fg:#E4EBF2;--mu:#9AAABB;--ln:#2D3B49;--pri:#8DB1D0;--pd:#A9C6DE;--ps:#24384A;--acc:#EBA05A;--as:#3A2C1D;--good:#6CC49A;--bad:#E58A82;--warn:#D8B35D;--badbg:#412826;--warnbg:#3C3020;--goodbg:#20392E;
--c-P:#9DB9D3;--c-I:#9AA9B8;--c-Q:#A5AFBA;--c-EM:#5FC0B3;--c-J:#A99BD8;--c-PN:#E58A82;--c-IN:#8DB1D0;--c-OP:#5FC0B3;--c-ID:#A99BD8;--c-HY:#D8B35D;--c-GN:#84C494;--c-SV:#D58BB5;--onpd:#111A23;--sticky:#D9C978;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 15px/1.7 var(--sans);margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.35}h1{font:700 26px/1.3 var(--serif)}h2{font-size:19px}h3{font-size:16px}
p{margin:0}.sm{font-size:13.5px}.xs{font-size:12px}.mu{color:var(--mu)}.mono{font-family:var(--mono)}
.top{position:sticky;top:0;z-index:30;background:var(--s);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap;color:var(--pd);padding:10px 0}
.logo{width:28px;height:28px;border-radius:8px;background:var(--pd);display:grid;place-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 8px;white-space:nowrap;display:grid;text-align:center;line-height:1.2;color:var(--mu)}
.tabs button small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.tabs button[aria-selected=true]{color:var(--pd);border-bottom-color:var(--acc);font-weight:700}
main{padding-block:22px 60px}
.hero{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:20px 22px;box-shadow:var(--sh);margin-bottom:16px;display:grid;gap:8px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--pri)}
.lead{color:var(--mu);max-width:70ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{background:var(--s);border:1px solid var(--ln);border-radius:9px;padding:7px 13px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pd);color:var(--onpd);border-color:var(--pd)}.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.card.w{background:var(--s2);box-shadow:none}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.stack{display:grid;gap:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub{font:700 14px var(--sans);color:var(--pd);margin:2px 0 8px;display:flex;gap:8px;align-items:center}
.zhd{font:700 12px var(--sans);color:var(--mu);letter-spacing:.06em;margin-bottom:4px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{background:none;border:0;border-radius:7px;padding:5px 12px;font-size:13.5px;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--pd);color:var(--onpd)}
.cd{display:inline-block;font:500 11.5px var(--mono);border:1px solid currentColor;border-radius:6px;padding:0 6px;line-height:1.7;background:transparent;margin:1px 2px 1px 0;cursor:pointer;white-space:nowrap}
.t-I{color:var(--c-I)}.t-Q{color:var(--c-Q)}.t-EM{color:var(--c-EM)}.t-P{color:var(--c-P)}.t-J{color:var(--c-J)}.t-PN{color:var(--c-PN)}.t-IN{color:var(--c-IN)}.t-OP{color:var(--c-OP)}.t-ID{color:var(--c-ID)}.t-HY{color:var(--c-HY)}.t-GN{color:var(--c-GN)}.t-SV{color:var(--c-SV)}.t-M{color:var(--c-P)}.t-TI{color:var(--c-IN)}
.cd.miss{border-style:dashed;color:var(--warn);background:var(--warnbg)}
.cds{display:inline}
.badge{font-size:11.5px;border-radius:99px;padding:1px 9px;background:var(--ps);color:var(--pd);white-space:nowrap}
.b-ok{background:var(--goodbg);color:var(--good)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}
.quote{border-left:3px solid var(--acc);padding:2px 0 2px 10px;color:var(--fg);font-size:14px}
.empty{border:1.5px dashed var(--ln);border-radius:12px;padding:22px;text-align:center;color:var(--mu);display:grid;gap:8px;justify-items:center;background:var(--s)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}table.t th,table.t td{border:1px solid var(--ln);padding:6px 9px;text-align:left;vertical-align:top}table.t th{background:var(--s2);font-weight:500;color:var(--mu)}
.sc{overflow-x:auto;max-width:100%}
.stage-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;background:var(--s2);display:grid;gap:2px}
.st.on{background:var(--goodbg);border-color:var(--good)}.st b{font-size:14px}
.note{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mu)}
/* notes */
.sn{background:var(--sticky);color:#33290a;border-radius:4px;padding:8px 10px;font-size:13.5px;line-height:1.5;box-shadow:0 2px 5px rgba(0,0,0,.12);display:grid;gap:3px}
.sn.g{background:#cfe7d4}.sn.r{background:#f3d1cc}.sn.b{background:#d4e2f1}.sn .cd{color:#33290a;background:rgba(255,255,255,.45)}
.sn.g .cd,.sn.r .cd,.sn.b .cd{color:#33290a}
/* empathy */
.em{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.em .q{border:1px solid var(--ln);border-radius:12px;background:var(--s);padding:10px 12px;display:grid;gap:6px;align-content:start;min-height:120px}
.em .q h4{margin:0;font-size:13px;color:var(--pd);display:flex;justify-content:space-between}
@media(max-width:560px){.em{grid-template-columns:1fr}}
/* orid */
.orid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.orid .l{border:1px solid var(--ln);border-radius:12px;background:var(--s);padding:10px 12px;display:grid;gap:7px;align-content:start}
.orid .l h4{margin:0;font-size:13px;display:flex;gap:6px;align-items:center}.orid .lv{width:22px;height:22px;border-radius:50%;background:var(--pd);color:var(--onpd);display:grid;place-items:center;font:500 12px var(--mono)}
/* persona */
.per{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:700px){.per{grid-template-columns:1fr}}
.pcol{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--ps);border-radius:14px;padding:18px 14px}
.av{width:140px;height:140px;border-radius:50%;background:var(--s2);border:4px solid var(--s);box-shadow:0 0 0 2px var(--pri);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--pri)}
.av img{width:100%;height:100%;object-fit:cover}.av .sil{width:70%;height:70%}.av.sm{width:34px;height:34px;border-width:2px;box-shadow:0 0 0 1px var(--pri)}
.upl{font-size:12.5px;border:1px dashed var(--pri);border-radius:8px;padding:4px 10px;color:var(--pd);cursor:pointer;background:var(--s)}.upl input{display:none}
.pf dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;margin:0}.pf dt{font-size:12.5px;color:var(--mu);font-weight:700}.pf dd{margin:0}
.pf ul{margin:0;padding-left:18px}
/* journey */
.jm{border-collapse:separate;border-spacing:0;min-width:760px;width:100%;font-size:13px}
.jm th,.jm td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:7px 9px;vertical-align:top;text-align:left}
.jm th.rh{background:var(--s2);width:104px;position:sticky;left:0;z-index:1;font-weight:700;color:var(--pd)}
.jm tr.zh td,.jm tr.zh th{background:var(--pd);color:var(--onpd);font-size:12px;letter-spacing:.06em;padding:4px 9px}
.jm td.stg{background:var(--ps);font-weight:700;color:var(--pd)}
.jm td.emo{padding:0;height:56px}.jm td.emo svg{display:block;width:100%;height:56px}
/* db */
.srch{width:100%;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;background:var(--s2)}
.dbg{margin-top:14px}.dbg h3{margin-bottom:6px;color:var(--pd)}
.dbr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;margin-bottom:6px}
.dbr:hover{border-color:var(--pri)}.dbr.ret{opacity:.6}.dbr .n{font-size:12px;color:var(--mu);white-space:nowrap}
.dbr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* drawer & modal */
#drw,#mdl{position:fixed;inset:0;z-index:50;background:rgba(17,26,35,.45);display:flex;justify-content:flex-end}
#mdl{justify-content:center;align-items:flex-start;padding:5vh 12px;overflow:auto}
#drw .pn{width:min(460px,100%);background:var(--s);height:100%;overflow:auto;padding:20px max(18px,env(safe-area-inset-right,0px)) 40px 18px;display:grid;gap:12px;align-content:start}
#mdl .pn{width:min(860px,100%);background:var(--s);border-radius:16px;padding:20px;display:grid;gap:12px;box-shadow:var(--sh)}
.x{justify-self:end;background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:3px 10px;font-size:12.5px}
.tr ul{list-style:none;margin:4px 0 0;padding-left:14px;border-left:1px dashed var(--ln)}.tr li{margin:4px 0}
.iss{border-left:4px solid var(--ln);padding:5px 10px;margin:3px 0;background:var(--s2);border-radius:0 8px 8px 0;font-size:13px}.iss.err{border-color:var(--bad)}.iss.warn{border-color:var(--warn)}
.diff{font-size:12.5px;display:grid;gap:2px;margin:2px 0 6px 0}.diff del{color:var(--bad)}.diff ins{color:var(--good);text-decoration:none}
details{border:1px solid var(--ln);border-radius:10px;background:var(--s);padding:6px 12px}summary{cursor:pointer;font-weight:500}
textarea.ta{width:100%;min-height:200px;border:1px solid var(--ln);border-radius:10px;padding:10px;background:var(--s2);font:12.5px/1.6 var(--mono)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pd);color:var(--onpd);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:80;max-width:92vw;box-shadow:var(--sh)}
.foot{margin-top:28px;color:var(--mu);font-size:12.5px}
:root{--sc5:#7BC79A;--sc5t:#143D29;--sc4:#3F5FA8;--sc4t:#FFFFFF;--sc3:#CFDDF6;--sc3t:#1F3A6B;--sc2:#F3DD6F;--sc2t:#4A3D06;--sc0:#D6DAE0;--sc0t:#4A5561}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sc5:#4E9E72;--sc5t:#0C2417;--sc4:#5C7FD0;--sc4t:#FFFFFF;--sc3:#2C3F63;--sc3t:#CFDDF6;--sc2:#9C8A2C;--sc2t:#FFF6C9;--sc0:#3A434E;--sc0t:#B8C0CA}}
:root[data-theme="dark"]{--sc5:#4E9E72;--sc5t:#0C2417;--sc4:#5C7FD0;--sc4t:#FFFFFF;--sc3:#2C3F63;--sc3t:#CFDDF6;--sc2:#9C8A2C;--sc2t:#FFF6C9;--sc0:#3A434E;--sc0t:#B8C0CA}
.tm-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.tm-info .ti{background:var(--s);border:1px solid var(--ln);border-top:3px solid var(--pri);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.tm-info .ti b{font-size:12px;letter-spacing:.06em;color:var(--pri)}.tm-info .ti span{font-size:14px;white-space:pre-wrap}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:14px}
.mc{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;display:grid;gap:12px;box-shadow:0 1px 2px rgba(30,43,56,.06),0 6px 18px rgba(30,43,56,.05);align-content:start;min-width:0}
.mc .mh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.mc .mav{width:92px;height:92px;border-radius:50%;background:var(--s2);border:3px solid var(--s);box-shadow:0 0 0 2px var(--pri);overflow:hidden;display:grid;place-items:center;color:var(--pri);position:relative}
.mc .mav img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}.mc .mav svg{width:68%;height:68%}
.mc h3{font:700 18px/1.3 var(--sans);margin:0}.mc h3 small{font:500 13px var(--sans);color:var(--mu);margin-left:6px}
.mc .rl{font-size:12.5px;color:var(--pd);background:var(--ps);border-radius:99px;padding:1px 10px;display:inline-block;margin-top:4px}
.mc .mid{font:500 11px var(--mono);color:var(--mu);margin-left:6px}
.mc .mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:560px){.mc .mg{grid-template-columns:1fr}.mc .mh{grid-template-columns:auto minmax(0,1fr)}}
.mc .mb{background:var(--s2);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55;border-left:3px solid var(--ln)}
.mc .mb b{display:block;font-size:11.5px;letter-spacing:.08em;margin-bottom:2px;color:var(--mu)}
.mc .mb.k{border-left-color:var(--pri)}.mc .mb.x{border-left-color:var(--acc)}.mc .mb.g{background:var(--ps);border-left-color:var(--pd)}.mc .mb.g b{color:var(--pd)}.mc .mb.i{border-left-color:var(--good)}
.mc .str{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mu)}
.mc .str i{font-style:normal;background:var(--sc4);color:var(--sc4t);border-radius:6px;padding:0 7px;line-height:1.7}
.mc .str i.l5{background:var(--sc5);color:var(--sc5t)}
.hm-wrap{overflow-x:auto;max-width:100%}
table.hm{border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px;width:100%}
table.hm th,table.hm td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:center}
table.hm thead th{font-weight:500;color:var(--pd);background:var(--s2);vertical-align:bottom;line-height:1.35}
table.hm th.rn{text-align:left;position:sticky;left:0;background:var(--s2);z-index:1;white-space:nowrap}
table.hm tbody th.rn{background:var(--s);font-weight:500}
.hm .p{display:inline-block;min-width:34px;border-radius:8px;padding:1px 8px;font:700 13px var(--sans)}
.hm .p5{background:var(--sc5);color:var(--sc5t)}.hm .p4{background:var(--sc4);color:var(--sc4t)}.hm .p3{background:var(--sc3);color:var(--sc3t)}.hm .p2{background:var(--sc2);color:var(--sc2t)}.hm .p1{background:var(--sc2);color:var(--sc2t);opacity:.7}.hm .p0{background:var(--sc0);color:var(--sc0t);font-weight:500}.hm .pn{color:var(--mu)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);align-items:center;margin-top:8px}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.cov .cv{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.cv h4{margin:0;font-size:14px}.cv .bar{display:flex;gap:3px}.cv .bar i{flex:1;height:8px;border-radius:3px;background:var(--sc0)}
.cv .bar i.p5{background:var(--sc5)}.cv .bar i.p4{background:var(--sc4)}.cv .bar i.p3{background:var(--sc3)}.cv .bar i.p2,.cv .bar i.p1{background:var(--sc2)}
.cv .tg{font-size:11.5px;border-radius:99px;padding:1px 9px;white-space:nowrap}
.tg.ok{background:var(--goodbg,#DDEFE6);color:var(--good)}.tg.sp{background:var(--warnbg,#F8EDD3);color:var(--warn)}.tg.gap{background:var(--badbg,#F9E3E1);color:var(--bad)}
.cvn{background:var(--ps);border-radius:10px;padding:10px 14px;font-size:14px}
.tm-up{font-size:12.5px;border:1px dashed var(--pri);border-radius:8px;padding:2px 9px;color:var(--pd);cursor:pointer;background:var(--s);display:inline-block;margin-top:6px}.tm-up input{display:none}

.stack>*,.card,.hero,#teambody>*{min-width:0;max-width:100%}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8"><path d="M1 9 5 4l4 5-4 5zM9 9l4-5 4 5-4 5z" style="stroke:var(--onpd)"/></svg></div><span>ORID 專案工作台</span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="分頁"></nav>
</div></header>
<main><div class="wrap" id="app">
  <section class="tab" id="tab-team" data-tab="team"></section>

/* ===== 團隊頁（兩個 App 共用）：teamHTML(T,{up}) =====
   T={members:[{code,name,en,role,pair,knowledge,experience,goal,interests}],caps:[...],skills:{code:{cap:'3'|'培養'}},info:[{code,topic,content}],photos:{code:dataURL}} */
const TM_E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
var TM_SIL=window.TM_SIL='<svg viewBox="0 0 64 64" fill="currentColor"><circle cx="32" cy="22" r="11"/><path d="M10 60c0-13 9-22 22-22s22 9 22 22z"/></svg>';
const tmScore=v=>{v=String(v==null?'':v).trim();if(v==='')return null;if(v==='培養')return 0;const n=parseInt(v,10);return isNaN(n)?null:Math.max(0,Math.min(5,n))};
const tmPill=v=>{const n=tmScore(v);return n===null?'<span class="pn">—</span>':n===0?'<span class="p p0">培養</span>':`<span class="p p${n}">${n}</span>`};
function tmCoverage(T){return T.caps.map(cap=>{const rows=T.members.map(m=>({m,v:tmScore((T.skills[m.code]||{})[cap])}));const vs=rows.filter(r=>r.v!==null);const max=vs.length?Math.max(...vs.map(r=>r.v)):0;
 const strong=vs.filter(r=>r.v>=4),leads=max>0?vs.filter(r=>r.v===max):[],grow=vs.filter(r=>r.v===0).length,mid=vs.filter(r=>r.v>=3).length;
 const st=strong.length>=2?['ok','穩健']:strong.length===1?['sp','單點依賴']:max>=3?['sp','無高分成員']:['gap','缺口'];
 return{cap,rows,max,strong,leads,grow,mid,st}})}
function teamHTML(T,o){o=o||{};const ms=T.members;
 if(!ms.length)return'<div class="empty"><div>還沒有團隊資料。</div></div>';
 const cov=tmCoverage(T);const sp=cov.filter(c=>c.st[1]==='單點依賴').length,ok=cov.filter(c=>c.st[1]==='穩健').length,gap=cov.filter(c=>c.st[0]==='gap'||c.st[1]==='無高分成員').length;
 const info=(T.info||[]).length?`<div class="sub">團隊簡介</div><div class="tm-info">${T.info.map(i=>`<div class="ti"><b>${TM_E(i.topic)}</b><span>${TM_E(i.content)}</span></div>`).join('')}</div>`:'';
 const card=m=>{const img=(T.photos||{})[m.code];const sk=T.skills[m.code]||{};const top=T.caps.map(c=>[c,tmScore(sk[c])]).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]);
  return`<article class="mc"><div class="mh"><div><div class="mav">${img?`<img src="${img}" alt="${TM_E(m.name)}">`:(o.base!=null?`<img src="${TM_E(o.base)}photos/${TM_E(m.code)}.jpg" alt="${TM_E(m.name)}" onerror="this.outerHTML=window.TM_SIL">`:TM_SIL)}</div>${o.up?`<label class="tm-up" data-noexp><input type="file" accept="image/*" data-tup="${TM_E(m.code)}">${img?'更換照片':'上傳照片'}</label>`:''}</div>
  <div style="min-width:0"><h3>${TM_E(m.name)}<small>${TM_E(m.en)}</small></h3>${m.role?`<span class="rl">${TM_E(m.role)}</span>`:''}<div class="xs mu" style="margin-top:4px"><span class="mid" style="margin:0">${TM_E(m.code)}</span>${m.pair?` <span class="mid">第 ${TM_E(m.pair)} 對</span>`:''}</div></div></div>
  <div class="mg"><div class="mb k"><b>知識</b>${TM_E(m.knowledge)}</div><div class="mb x"><b>經驗</b>${TM_E(m.experience)}</div><div class="mb g"><b>目標</b>${TM_E(m.goal)}</div><div class="mb i"><b>能力／興趣</b>${TM_E(m.interests)}</div></div>
  ${top.length?`<div class="str">強項：${top.map(([c,v])=>`<i class="${v===5?'l5':''}">${TM_E(c.replace(/力$/,''))} ${v}</i>`).join('')}</div>`:''}</article>`};
 const hm=`<div class="sub">團隊能力矩陣</div><div class="card"><div class="hm-wrap"><table class="hm"><thead><tr><th class="rn">成員</th>${T.caps.map(c=>`<th>${TM_E(c)}</th>`).join('')}</tr></thead><tbody>${ms.map(m=>`<tr><th class="rn">${TM_E(m.name)} ${TM_E(m.en)}</th>${T.caps.map(c=>`<td>${tmPill((T.skills[m.code]||{})[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="lg"><span>圖例</span><span class="p p5 hmx" style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc5);color:var(--sc5t)">5</span>精通<span style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc4);color:var(--sc4t)">4</span>熟練<span style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc3);color:var(--sc3t)">3</span>勝任<span style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc2);color:var(--sc2t)">2</span>基礎<span style="display:inline-block;min-width:36px;text-align:center;border-radius:8px;background:var(--sc0);color:var(--sc0t)">培養</span>待培養</div></div>`;
 const spN=cov.filter(c=>c.st[1]==='單點依賴').map(c=>`${c.cap}（僅 ${c.leads.map(r=>r.m.en||r.m.name).join('、')}）`),gapN=cov.filter(c=>c.st[0]==='gap'||c.st[1]==='無高分成員').map(c=>c.cap);
 const cv=`<div class="sub">能力覆蓋摘要</div><div class="cvn">${cov.length} 項能力中，<b>${ok}</b> 項有 2 位以上高分（≥4）成員，<b>${sp}</b> 項為單點依賴（只有 1 位高分），<b>${gap}</b> 項缺高分成員。${spN.length?`<br>單點依賴：${spN.map(TM_E).join('；')}。`:''}${gapN.length?`<br>缺口：${gapN.map(TM_E).join('；')}。`:''}${spN.length||gapN.length?'<br>建議為這些項目指定補位人，或尋求外部顧問。':'<br>各項能力都有 2 位以上高分成員，覆蓋穩健。'}</div>
 <div class="cov" style="margin-top:10px">${cov.map(c=>`<div class="cv"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:8px"><h4>${TM_E(c.cap)}</h4><span class="tg ${c.st[0]}">${c.st[1]}</span></div><div class="bar" title="每格代表一位成員">${c.rows.map(r=>`<i class="${r.v===null?'':'p'+r.v}"></i>`).join('')}</div>
 <div class="xs mu">${c.max>0?`主責：${c.leads.map(r=>TM_E(r.m.en||r.m.name)).join('、')}（${c.max} 分）`:'目前沒有人具備'}｜≥3 分 ${c.mid} 人｜培養中 ${c.grow} 人</div></div>`).join('')}</div>`;
 return info+`<div class="sub" style="margin-top:18px">成員 Profile（${ms.length}）</div><div class="tm-grid">${ms.map(card).join('')}</div>`+hm+cv}

const splitCodes=s=>String(s||'').split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean);
const splitBeh=s=>String(s||'').split(/[;；\n]+/).map(x=>x.trim()).filter(Boolean);
const nat=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true});

/* ---------- dynamic Skills columns ---------- */
let SKCAPS=[];
const colsOf=sh=>sh==='Skills'?['code','name',...SKCAPS,'status','batch']:SH[sh].cols;
function rebuildCaps(){const base=new Set(['code','name','status','batch']);const seen=[];Object.values(S.tables.Skills).forEach(r=>Object.keys(r).forEach(k=>{if(!base.has(k)&&!seen.includes(k))seen.push(k)}));SKCAPS=seen.concat(SKCAPS.filter(c=>!seen.includes(c)))}

function newStore(){const t={};ORDER.forEach(k=>t[k]={});return{v:1,tables:t,photos:{},log:[]}}
const rowsOf=(sh,all)=>Object.values(S.tables[sh]).filter(r=>all||r.status==='有效').sort((a,b)=>nat(a[SH[sh].k],b[SH[sh].k]));
const clone=o=>JSON.parse(JSON.stringify(o));
function buildIndex(tables){const ix=new Map();ORDER.forEach(sh=>SH[sh].noidx||Object.values(tables[sh]).forEach(r=>ix.set(r[SH[sh].k],{sheet:sh,row:r})));return ix}
let IX=new Map(),REFBY=new Map();
function refsOf(sh,r){const out=[];const add=(col,codes)=>codes.forEach(c=>out.push([col,c]));
 if(sh==='Skills')add('code',[r.code]);
 if(sh==='Quotes')add('interview',[r.interview]);
 if(sh==='Empathy'){add('interview',[r.interview]);add('src',splitCodes(r.src))}
 if(sh==='Items'){add('src',splitCodes(r.src));add('from',splitCodes(r.from));if(r.merged_into)add('merged_into',[r.merged_into])}
 if(sh==='Personas'){add('pn',splitCodes(r.pn));add('gn',splitCodes(r.gn));add('src',splitCodes(r.src))}
 if(sh==='Journey'){add('persona',[r.persona]);add('pain',splitCodes(r.pain));add('opp',splitCodes(r.opp))}
 return out.filter(x=>x[1])}
function reindex(){rebuildCaps();IX=buildIndex(S.tables);REFBY=new Map();
 ORDER.forEach(sh=>SH[sh].noidx||Object.values(S.tables[sh]).forEach(r=>refsOf(sh,r).forEach(([,c])=>{const k=r[SH[sh].k];(REFBY.get(c)||REFBY.set(c,new Set()).get(c)).add(k)})))}
function dangling(){const out=[];ORDER.forEach(sh=>Object.values(S.tables[sh]).forEach(r=>{if(r.status!=='有效')return;refsOf(sh,r).forEach(([col,c])=>{if(!IX.has(c))out.push({from:r[SH[sh].k],sheet:sh,col,code:c})})}));return out}
function info(code){const h=IX.get(code);if(!h)return null;const r=h.row,sh=h.sheet;
 const m={Team:()=>[`${r.name} ${r.en||''}`.trim(),r.role||''],TeamInfo:()=>[r.topic,r.content||''],Skills:()=>[r.name||r.code,''],Interviews:()=>[`${r.name}`,`${r.role||''}${r.date?'｜'+r.date:''}${r.place?' '+r.place:''}`],
 Quotes:()=>[r.text,`${r.interview} · ${{O:'事實',R:'感受',I:'詮釋',D:'決定'}[r.level]||r.level}`],
 Empathy:()=>[`[${r.quad}] ${r.text}`,r.interview],
 Items:()=>[r.title,r.desc||''],
 Personas:()=>[`${r.name}${r.tag?'｜'+r.tag:''}`,r.quote||''],
 Journey:()=>[`${r.persona} 階段${r.stage_no}：${r.stage}`,r.do||'']};
 const [title,desc]=m[sh]();return{sheet:sh,row:r,title,desc,type:typeOf(code)}}
function nextIds(){const mx={};TYPES.forEach(([t])=>mx[t]=0);let iv=0,em=0,pe=0,mm=0,ti=0;
 Object.values(S.tables.Items).forEach(r=>{const m=r.code.match(/^([A-Z]{2})-(\d+)$/);if(m&&mx[m[1]]!=null)mx[m[1]]=Math.max(mx[m[1]],+m[2])});
 Object.values(S.tables.Interviews).forEach(r=>{const m=r.id.match(/-(\d+)$/);if(m)iv=Math.max(iv,+m[1])});
 Object.values(S.tables.Empathy).forEach(r=>{const m=r.id.match(/-(\d+)$/);if(m)em=Math.max(em,+m[1])});
 Object.values(S.tables.Personas).forEach(r=>{const m=r.code.match(/-(\d+)$/);if(m)pe=Math.max(pe,+m[1])});
 Object.values(S.tables.Team).forEach(r=>{const m=r.code.match(/-(\d+)$/);if(m)mm=Math.max(mm,+m[1])});
 Object.values(S.tables.TeamInfo).forEach(r=>{const m=r.code.match(/-(\d+)$/);if(m)ti=Math.max(ti,+m[1])});
 const p=(a,n,w)=>a+'-'+String(n+1).padStart(w,'0');
 const o={I:p('I',iv,2),EM:p('EM',em,3),P:p('P',pe,2),M:p('M',mm,2),TI:p('TI',ti,2)};TYPES.forEach(([t])=>o[t]=p(t,mx[t],2));return o}

/* ---------- parse workbook ---------- */
const hdrKey=(sh,h)=>{const x=String(h||'').trim();if(!x)return null;const l=x.toLowerCase();if(sh==='Skills'){if(['code','name','status','batch'].includes(l))return l;if(x==='編號')return'code';if(x==='姓名'||x==='名稱')return'name';if(x==='狀態')return'status';if(x==='批次')return'batch';if(!SKCAPS.includes(x))SKCAPS.push(x);return x}
 if(SH[sh].cols.includes(l))return l;const a=ALIAS[x]||ALIAS[l];return a==='@k'?SH[sh].k:(a&&SH[sh].cols.includes(a)?a:null)};
function normRow(sh,raw){const o={};if(sh==='Skills')Object.keys(raw).forEach(h=>hdrKey(sh,h));colsOf(sh).forEach(c=>o[c]='');
 Object.entries(raw).forEach(([h,v])=>{const k=hdrKey(sh,h);if(!k)return;let s=String(v==null?'':v).trim();o[k]=s});
 (LIST[sh]||[]).forEach(c=>{if(o[c]&&o[c]!=='-')o[c]=splitCodes(o[c]).join(', ')});
 if(sh==='Personas'&&o.behaviors&&o.behaviors!=='-')o.behaviors=splitBeh(o.behaviors).join('；');
 if(o.level&&o.level!=='-')o.level=o.level.toUpperCase();
 if(o.type&&o.type!=='-')o.type=o.type.toUpperCase();
 if(o.quad&&o.quad!=='-')o.quad=QUAD[o.quad.toLowerCase()]||o.quad;
 const st=o.status.toLowerCase();o.status=STATUS[st]!==undefined?STATUS[st]:o.status;
 if(o.photo&&o.photo!=='-')o.photo=o.photo.replace(/^.*[\\/]/,'');
 return o}
function readWorkbook(buf){const wb=XLSX.read(buf,{type:'array'});const inc={},ignored=[],found=[];
 wb.SheetNames.forEach(n=>{const sh=ORDER.find(x=>x.toLowerCase()===n.trim().toLowerCase());if(!sh){if(n!=='說明')ignored.push(n);return}
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:false});const list=[];
  rows.forEach((r,i)=>{const o=normRow(sh,r);if(Object.values(o).every(v=>v===''))return;o.__row=i+2;list.push(o)});found.push(sh);inc[sh]=list});
 return{inc,ignored,found}}

/* ---------- validate + diff ---------- */
const CONTENT=sh=>colsOf(sh).filter(c=>c!==SH[sh].k&&c!=='batch');
function mergeRow(sh,old,inc){const o={};colsOf(sh).forEach(c=>{const v=inc[c];o[c]=v==='-'?'':(v===''?(old?old[c]:''):v)});if(!o.status)o.status='有效';return o}
function plan(workbook,fileName){
 const issues=[],P={};let nNew=0,nChg=0,nSame=0,nRet=0,nBad=0;
 const view={};ORDER.forEach(sh=>view[sh]=Object.assign({},S.tables[sh]));
 const staged={};
 ORDER.forEach(sh=>{const rows=workbook.inc[sh];if(!rows)return;const key=SH[sh].k,seen={},dup=new Set();
  rows.forEach(r=>{const c=r[key];if(c){if(seen[c])dup.add(c);seen[c]=1}});
  P[sh]={new:[],chg:[],same:0,bad:0};staged[sh]=[];
  rows.forEach(r=>{const code=r[key],errs=[],warns=[];const add=(l,m)=>(l==='err'?errs:warns).push(m);
   if(!code){add('err','缺少編號')}
   else if(!RE[sh].test(code)){add('err',`編號格式不符（應類似 ${{Interviews:'I-01',Quotes:'I-01.R1',Empathy:'EM-001',Items:'PN-01',Personas:'P-01',Journey:'JM-P-01-S1'}[sh]}）`)}
   else if(dup.has(code))add('err','同一份檔案內編號重複');
   const old=code?S.tables[sh][code]:null;
   if(code&&RE[sh].test(code)){
    if(sh==='Quotes'){const m=code.match(/^(I-\d+)\.([ORID])/);if(r.interview&&r.interview!=='-'&&r.interview!==m[1])add('err',`interview 欄 ${r.interview} 與編號 ${m[1]} 不一致`);if(r.level&&r.level!=='-'&&r.level!==m[2])add('err',`level 欄 ${r.level} 與編號層級 ${m[2]} 不一致`);r.interview=m[1];r.level=m[2]}
    if(sh==='Items'){const t=code.slice(0,2);if(r.type&&r.type!=='-'&&r.type!==t)add('err',`type 欄 ${r.type} 與編號前綴 ${t} 不一致`);r.type=t}
    if(sh==='Journey'){const m=code.match(/^JM-(P-\d+)-S(\d+)$/);if(r.persona&&r.persona!=='-'&&r.persona!==m[1])add('err',`persona 欄與編號不一致（應為 ${m[1]}）`);if(r.stage_no&&r.stage_no!=='-'&&String(r.stage_no)!==m[2])add('err',`stage_no 與編號不一致（應為 ${m[2]}）`);r.persona=m[1];r.stage_no=m[2]}
    if(sh==='Empathy'&&r.quad&&!['說','想','看','聽','痛','得'].includes(r.quad))add('err',`象限 ${r.quad} 不在 說／想／看／聽／痛／得`);
    if(!['有效','作廢','併入'].includes(r.status))add('err',`status「${r.status}」不是 有效／作廢／併入`);
   }
   const merged=code?mergeRow(sh,old,r):null;
   if(merged&&errs.length===0){
    SH[sh].req.forEach(f=>{if(!merged[f])add('err',`新增列缺少必填欄位 ${f}`)});
    if(merged.status==='併入'){if(!merged.merged_into)add('err','status 為「併入」時必須填 merged_into');}
    if(old&&old.status!=='有效'&&CONTENT(sh).some(c=>c!=='status'&&c!=='merged_into'&&merged[c]!==old[c]))add('err',`編號 ${code} 已${old.status}，不可重用；請改用新編號`);
    if(old&&old.status!=='有效'&&merged.status==='有效'&&!CONTENT(sh).some(c=>c!=='status'&&merged[c]!==old[c]))add('warn','編號已恢復為有效');
    if(sh==='Skills')SKCAPS.forEach(c=>{const v=merged[c];if(v&&v!=='培養'&&!/^[1-5]$/.test(v))add('warn',`${c} 的值「${v}」應為 1–5 或「培養」`)});
    if(sh==='Journey'&&merged.feel&&!(/^[1-5]$/.test(merged.feel)))add('warn','feel 建議為 1–5 的整數');
    if(sh==='Personas'&&merged.age&&!/^\d{1,3}$/.test(merged.age))add('warn','age 建議為數字');
   }
   errs.forEach(m=>issues.push({lvl:'err',sheet:sh,key:code||`第 ${r.__row} 列`,msg:m}));
   if(errs.length){P[sh].bad++;nBad++;return}
   warns.forEach(m=>issues.push({lvl:'warn',sheet:sh,key:code,msg:m}));
   staged[sh].push({code,merged,old,raw:r});
   view[sh][code]=merged});
 });
 /* 第二輪：參照檢查（用合併後視圖） */
 const vix=buildIndex(view);
 ORDER.forEach(sh=>(staged[sh]||[]).forEach(({code,merged,old})=>{
  refsOf(sh,merged).forEach(([col,c])=>{if(!vix.has(c)){issues.push({lvl:'warn',sheet:sh,key:code,msg:`${col} 引用的 ${c} 目前找不到 → 標為「待補來源」`})}});
  if(merged.status==='併入'&&merged.merged_into&&!vix.has(merged.merged_into))issues.push({lvl:'warn',sheet:sh,key:code,msg:`merged_into 的 ${merged.merged_into} 找不到`});
  const ch=old?CONTENT(sh).filter(c=>merged[c]!==old[c]).map(c=>[c,old[c],merged[c]]):[];
  if(!old){P[sh].new.push({code,merged});nNew++}
  else if(ch.length){P[sh].chg.push({code,ch,merged});nChg++;if(old.status==='有效'&&merged.status!=='有效')nRet++}
  else{P[sh].same++;nSame++}}));
 const warn=issues.filter(i=>i.lvl==='warn').length,err=issues.filter(i=>i.lvl==='err').length;
 return{file:fileName,P,staged,issues,nNew,nChg,nSame,nRet,nBad,warn,err,ignored:workbook.ignored,found:workbook.found}}
function apply(pl){PREV={tables:clone(S.tables),logLen:S.log.length};
 const bid='B-'+String(S.log.length+1).padStart(3,'0');const entry={id:bid,at:new Date().toISOString(),file:pl.file,kind:'excel',new:{},chg:{},retired:[],warn:pl.warn,err:pl.err};
 ORDER.forEach(sh=>(pl.staged[sh]||[]).forEach(({code,merged,old,raw})=>{
  const same=old&&!CONTENT(sh).some(c=>merged[c]!==old[c]);if(same)return;
  merged.batch=(raw.batch&&raw.batch!=='-')?raw.batch:bid;S.tables[sh][code]=merged;
  if(!old)(entry.new[sh]=entry.new[sh]||[]).push(code);else(entry.chg[sh]=entry.chg[sh]||[]).push(code);
  if(old&&old.status==='有效'&&merged.status!=='有效')entry.retired.push(code)}));
 S.log.push(entry);reindex();return entry}
function undo(){if(!PREV)return false;S.tables=PREV.tables;S.log.length=PREV.logLen;PREV=null;reindex();return true}

function normPersonaStem(name){const stem=name.replace(/\.[^.]+$/,'').trim();let m=stem.match(/^P-?(\d+)$/i);if(m)return'P-'+String(+m[1]).padStart(2,'0');m=stem.match(/^M-?(\d+)$/i);if(m)return'M-'+String(+m[1]).padStart(2,'0');const t=Object.values(S.tables.Team).find(r=>r.name===stem||(r.en&&r.en.toLowerCase()===stem.toLowerCase())||(r.name+' '+r.en).toLowerCase()===stem.toLowerCase());return t?t.code:null}
function resizeImg(file,max=480){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.86))};im.src=rd.result};rd.readAsDataURL(file)})}
async function addPhotos(files){const ok=[],miss=[];
 for(const f of files){if(!/^image\//.test(f.type)||f.size>15e6){miss.push(f.name);continue}
  let code=normPersonaStem(f.name);
  if(!code){const p=Object.values(S.tables.Personas).find(r=>r.photo&&r.photo.toLowerCase()===f.name.toLowerCase())||Object.values(S.tables.Team).find(r=>r.photo&&r.photo.toLowerCase()===f.name.toLowerCase());if(p)code=p.code}
  if(!code){miss.push(f.name);continue}
  S.photos[code]=await resizeImg(f);ok.push(code)}
 if(ok.length)S.log.push({id:'B-'+String(S.log.length+1).padStart(3,'0'),at:new Date().toISOString(),file:'照片',kind:'photo',new:{},chg:{[/^M-/.test(ok[0])?'Team':'Personas']:ok},retired:[],warn:0,err:0});
 return{ok,miss}}

async function exportView(kind,el,name){

 else{const{jsPDF}=window.jspdf;const pw=210,ph=297,m=8;const w=pw-2*m;const hAll=cv.height*w/cv.width;const doc=new jsPDF({unit:'mm',format:'a4',orientation:'p'});

   doc.addImage(c2.toDataURL('image/jpeg',.92),'JPEG',m,m,w,sh/pxPer)}
  doc.save(`${name}_${stamp()}.pdf`)}}

 const any=G.some(([t])=>rowsOf('Items').some(r=>r.type===t));
 $('#tab-develop').innerHTML=hero('DEVELOP · DELIVER','機會點、構想、服務與假設','以編碼清單呈現；每一筆都可追溯到上游的洞察與原話。價值主張圖、藍圖、BMC 等畫布不在專案模式內。',null,true)+
 (any?`<div class="stack">${G.map(([t,z])=>{const a=rowsOf('Items').filter(r=>r.type===t);return a.length?`<div><div class="sub">${z} <span class="badge">${a.length}</span></div><div class="g2">${a.map(r=>`<div class="card w stack"><span>${cd(r.code)} <b>${esc(r.title)}</b></span>${r.desc?`<span class="sm mu">${esc(r.desc)}</span>`:''}<span class="xs">${lc(r.from).length?'上游 '+cds(lc(r.from)):''} ${lc(r.src).length?'原話 '+cds(lc(r.src)):''}</span></div>`).join('')}</div></div>`:''}).join('')}</div>`:empty('還沒有機會點／構想／服務／假設。','Items（OP／ID／SV／HY）'))}
function vDB(){const typ=[['all','全部'],['M','成員'],['TI','團隊資訊'],['I','訪談'],['Q','原話'],['EM','同理心'],['P','Persona'],['J','旅程'],...TYPES];
 $('#tab-db').innerHTML=hero('EVIDENCE · 證據庫',`全案 ${ORDER.reduce((a,sh)=>a+rowsOf(sh).length,0)} 筆有效編號`,'輸入編號或關鍵字搜尋；點任一筆看內容、上游追溯與被誰引用。',`<input class="srch" id="q" type="search" placeholder="搜尋：PN-01、真偽、福委…" aria-label="搜尋證據庫" value="${esc(ST.dbq)}">`+seg('dbsg',typ,ST.dbf)+`<label class="xs"><input type="checkbox" id="dbr" ${ST.dbr?'checked':''}> 顯示作廢／併入</label>`,true)+`<div id="dblist"></div>`;drawDB()}
function drawDB(){const q=ST.dbq.trim().toLowerCase();const out=[];
 ORDER.forEach(sh=>rowsOf(sh,ST.dbr).forEach(r=>{const k=r[SH[sh].k],t=typeOf(k),i=info(k);if(ST.dbf!=='all'&&t!==ST.dbf)return;if(q&&!(k+i.title+i.desc).toLowerCase().includes(q))return;out.push({k,t,i,r})}));
 const grp={};out.forEach(o=>(grp[o.t]=grp[o.t]||[]).push(o));
 const order=['M','TI','I','Q','EM','P','J',...TYPES.map(x=>x[0])];
 $('#dblist').innerHTML=out.length?order.filter(t=>grp[t]).map(t=>`<div class="dbg"><h3>${TN[t]} ${t}・${grp[t].length}</h3>${grp[t].map(o=>`<button class="dbr ${o.r.status!=='有效'?'ret':''}" data-c="${esc(o.k)}"><span class="cd t-${t}">${esc(o.k)}</span><span class="t">${esc(o.i.title)}</span><span class="n">${o.r.status!=='有效'?`<span class="badge b-bad">${esc(o.r.status)}</span> `:''}被引用 ${(REFBY.get(o.k)||new Set()).size} 次</span></button>`).join('')}</div>`).join(''):'<p class="mu" style="margin-top:14px">找不到符合的資料。</p>'}
function vLog(){const L=[...S.log].reverse();const c=o=>Object.entries(o||{}).map(([sh,a])=>`<div class="xs"><b class="mono">${sh}</b>：${a.map(cd).join('')}</div>`).join('');
 $('#tab-log').innerHTML=hero('HISTORY · 變更紀錄','每一次匯入都留下紀錄','誰在什麼時候匯入了什麼檔案、新增與修改了哪些編號。匯出專案包會一併帶出。')+
 (L.length?`<div class="stack">${L.map(e=>{const nn=Object.values(e.new).flat().length,cc=Object.values(e.chg).flat().length;return`<details><summary><span class="mono">${esc(e.id)}</span>　${esc(new Date(e.at).toLocaleString('zh-TW'))}　${esc(e.file)}　<span class="badge b-ok">新增 ${nn}</span> <span class="badge">修改 ${cc}</span>${e.retired.length?` <span class="badge b-bad">作廢 ${e.retired.length}</span>`:''}${e.warn?` <span class="badge b-warn">警示 ${e.warn}</span>`:''}</summary><div class="stack" style="margin-top:8px">${nn?`<div class="zhd">新增</div>${c(e.new)}`:''}${cc?`<div class="zhd">修改</div>${c(e.chg)}`:''}${e.retired.length?`<div class="zhd">作廢／併入</div><div>${e.retired.map(cd).join('')}</div>`:''}</div></details>`}).join('')}</div>`:'<div class="empty">還沒有匯入紀錄。</div>')}
const VIEWS={team:vTeam,project:vProject,discover:vDiscover,define:vDefine,develop:vDevelop,db:vDB,log:vLog};
function renderAll(){reindex();Object.values(VIEWS).forEach(f=>f());const u=$('#bundo');u&&(u.disabled=!PREV)}
let CUR='project';
function showTab(t){if(!VIEWS[t])t='team';CUR=t;$$('.tab').forEach(s=>s.hidden=s.dataset.tab!==t);$$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));try{history.replaceState(null,'','#'+t)}catch(e){}window.scrollTo(0,0)}

/* ---------- drawer ---------- */
function trace(code,depth,seen){const h=IX.get(code);if(!h)return`<li>${cd(code)} <span class="xs mu">（尚未匯入）</span></li>`;
 if(seen.has(code))return`<li>${cd(code)} <span class="xs mu">（已出現）</span></li>`;seen.add(code);const i=info(code);
 const up=[...lc(h.row.src),...lc(h.row.from),...(h.sheet==='Quotes'||h.sheet==='Empathy'?[h.row.interview]:[])].filter(x=>x&&x!==code);
 return`<li>${cd(code)} <span class="xs">${esc(i.title).slice(0,70)}</span>${depth<5&&up.length?`<ul>${up.map(c=>trace(c,depth+1,seen)).join('')}</ul>`:''}</li>`}
function openC(c){const h=IX.get(c);const t=typeOf(c)||'I';
 if(!h){$('#db_').innerHTML=`<div><span class="cd t-${t} miss" style="cursor:default">${esc(c)}</span></div><h3>尚未匯入（待補來源）</h3><p class="sm mu">有項目引用了這個編號，但專案裡還沒有它。請在對應的工作表補上這一列再上傳。</p><div><div class="zhd">被這些項目引用</div>${cds([...(REFBY.get(c)||[])].sort(nat))}</div>`;$('#drw').hidden=false;return}
 const r=h.row,i=info(c),rb=[...(REFBY.get(c)||[])].sort(nat);
 const fields=colsOf(h.sheet).filter(k=>!['status','batch','type','title','name'].includes(k)&&r[k]&&k!==SH[h.sheet].k).map(k=>`<dt>${k}</dt><dd>${LIST[h.sheet]&&LIST[h.sheet].includes(k)?cds(lc(r[k])):esc(r[k])}</dd>`).join('');
 const photo=h.sheet==='Personas'&&S.photos[c]?`<div class="av" style="width:90px;height:90px"><img src="${S.photos[c]}" alt=""></div>`:'';
 $('#db_').innerHTML=`<div><span class="cd t-${t}" style="cursor:default">${esc(c)}</span> <span class="xs mu">${TN[t]}</span> ${r.status!=='有效'?`<span class="badge b-bad">${esc(r.status)}${r.merged_into?' → '+esc(r.merged_into):''}</span>`:''}</div>${photo}<h3>${esc(i.title)}</h3>
 <div class="pf"><dl style="grid-template-columns:90px minmax(0,1fr)">${fields}</dl></div>
 <div class="tr"><div class="zhd">來源追溯（往上）</div><ul style="border:0;padding:0">${trace(c,0,new Set())}</ul></div>
 <div><div class="zhd">被這些項目引用（往下）</div>${rb.length?cds(rb):'<span class="xs mu">還沒有人引用</span>'}</div>
 <p class="xs mu">批次 ${esc(r.batch||'—')}</p>`;$('#drw').hidden=false;$('#dx').focus()}

/* ---------- import preview ---------- */
function showPlan(pl,after){
 const sc=pl.nNew+pl.nChg;const E=pl.issues.filter(i=>i.lvl==='err'),W=pl.issues.filter(i=>i.lvl==='warn');
 const sheets=ORDER.filter(sh=>pl.P[sh]);
 const diffRow=(sh,x,isNew)=>`<div class="iss" style="border-color:${isNew?'var(--good)':'var(--pri)'}"><b class="mono">${esc(x.code)}</b> <span class="badge ${isNew?'b-ok':''}">${isNew?'新增':'修改'}</span> ${isNew?`<span class="xs">${esc((x.merged.title||x.merged.name||x.merged.text||x.merged.stage||'').slice(0,60))}</span>`:`<div class="diff">${x.ch.slice(0,6).map(([c,o,n])=>`<span><span class="mono">${c}</span>：<del>${esc(String(o).slice(0,50))||'（空）'}</del> → <ins>${esc(String(n).slice(0,50))||'（空）'}</ins></span>`).join('')}${x.ch.length>6?`<span class="xs mu">…還有 ${x.ch.length-6} 欄</span>`:''}</div>`}</div>`;
 modal(`<h2>匯入預覽：${esc(pl.file)}</h2>
 <div class="row"><span class="badge b-ok">新增 ${pl.nNew}</span><span class="badge">修改 ${pl.nChg}</span><span class="badge">無變動 ${pl.nSame}</span>${pl.nRet?`<span class="badge b-bad">作廢 ${pl.nRet}</span>`:''}<span class="badge ${W.length?'b-warn':''}">警示 ${W.length}</span><span class="badge ${E.length?'b-bad':''}">錯誤 ${E.length}（該列不會匯入）</span></div>
 <p class="xs mu">讀到的工作表：${pl.found.map(s=>`<span class="mono">${s}</span>`).join('、')||'無'}${pl.ignored.length?`｜略過：${pl.ignored.map(esc).join('、')}`:''}。沒出現在檔案中的既有資料一律保持原樣。</p>
 ${E.length?`<div><div class="zhd">錯誤（需修正後再上傳）</div>${E.slice(0,40).map(i=>`<div class="iss err"><b class="mono">${esc(i.sheet)}</b> ${esc(i.key)}：${esc(i.msg)}</div>`).join('')}${E.length>40?`<p class="xs mu">…還有 ${E.length-40} 筆</p>`:''}</div>`:''}
 ${W.length?`<details><summary>警示 ${W.length} 筆（仍會匯入）</summary>${W.slice(0,60).map(i=>`<div class="iss warn"><b class="mono">${esc(i.sheet)}</b> ${esc(i.key)}：${esc(i.msg)}</div>`).join('')}</details>`:''}
 ${sheets.map(sh=>{const p=pl.P[sh];return`<details ${p.new.length+p.chg.length&&sheets.length<=2?'open':''}><summary><span class="mono">${sh}</span>　新增 ${p.new.length}｜修改 ${p.chg.length}｜無變動 ${p.same}${p.bad?`｜錯誤 ${p.bad}`:''}</summary>${p.new.slice(0,60).map(x=>diffRow(sh,x,true)).join('')}${p.chg.slice(0,60).map(x=>diffRow(sh,x,false)).join('')}${p.new.length>60||p.chg.length>60?'<p class="xs mu">只列出前 60 筆。</p>':''}</details>`}).join('')}
 <div class="row"><button class="btn pri" id="goapply" ${sc?'':'disabled'}>${sc?`套用 ${sc} 筆變更`:'沒有可套用的變更'}</button><button class="btn" id="cancelapply">取消</button></div>`);
 $('#cancelapply').onclick=closeModal;
 $('#goapply').onclick=()=>{const e=apply(pl);closeModal();saveStore();renderAll();toast(`已套用 ${e.id}：新增 ${Object.values(e.new).flat().length}、修改 ${Object.values(e.chg).flat().length}`);after&&after()}}

async function importFile(file,name){try{const buf=await file.arrayBuffer();const wb=readWorkbook(buf);if(!wb.found.length){modal(`<h2>讀不到可用的工作表</h2><p>檔案中沒有 ${ORDER.join('／')} 其中任何一張工作表。請用「下載空白範本」或匯出的活頁簿。</p>`);return}showPlan(plan(wb,name||file.name))}catch(e){modal(`<h2>無法讀取這個檔案</h2><p class="sm">${esc(e.message||e)}</p>`)}}

/* ---------- events ---------- */
function bind(){
 document.addEventListener('click',async e=>{
  const T=e.target.closest('#tabs button');if(T)return showTab(T.dataset.t);
  if(e.target.id==='bteam')return importFile(new File([b64buf(B64.team)],'內建團隊資料.xlsx'));
  const sb=e.target.closest('[data-showtab]');if(sb)return showTab(sb.dataset.showtab);
  if(e.target.closest('[data-closem]')||e.target.id==='mdl')return closeModal();
  if(e.target.id==='drw'||e.target.id==='dx'){$('#drw').hidden=true;return}
  const ex=e.target.closest('[data-exv]');if(ex){const el=$('#tab-'+CUR);ex.disabled=true;toast('產生中…');try{await exportView(ex.dataset.exv,el,{team:'團隊',discover:'發現',define:'定義',develop:'發展與交付',db:'證據庫'}[CUR]||CUR);toast('已匯出')}catch(err){toast('匯出失敗：'+(err.message||err))}ex.disabled=false;return}
  const c=e.target.closest('[data-c]');if(c&&!e.target.closest('input'))return openC(c.dataset.c);
  const sg=e.target.closest('.seg button');if(sg){const id=sg.parentElement.id,k=sg.dataset.k;
   if(id==='dsg'){ST.ds=k;vDiscover()}else if(id==='ivsg'){ST.empI=k;vDiscover()}else if(id==='dfsg'){ST.df=k;vDefine()}else if(id==='prsg'){ST.pr=k;vDefine()}else if(id==='jpsg'){ST.jp=k;vDefine()}else if(id==='dbsg'){ST.dbf=k;$$('#dbsg button').forEach(b=>b.setAttribute('aria-pressed',b===sg));drawDB()}return}
  const id=e.target.closest('button')&&e.target.closest('button').id;
  if(id==='btpl')return download(new Blob([b64buf(B64.tpl)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'ORID專案範本.xlsx');
  if(id==='bsmp'){if(ORDER.some(sh=>Object.keys(S.tables[sh]).length)&&!await ask('範例資料會以「合併」方式加入目前專案（編號相同的列會被範例內容更新）。要繼續嗎？','繼續載入'))return;return importFile(new File([b64buf(B64.sample)],'範例_烏金預約.xlsx'))}
  if(id==='bundo'){if(undo()){saveStore();renderAll();toast('已復原上一次匯入')}return}
  if(id==='bclr'){if(await ask('這會清空目前專案的所有資料與照片（無法復原）。建議先匯出專案包備份。確定清空嗎？','清空')){S=newStore();PREV=null;saveStore();renderAll();toast('已清空專案')}return}
  if(id==='bxl')return exportXlsx();if(id==='bpk')return exportPackage();if(id==='bcs')return exportCsv();
  if(id==='bcp'){const ta=$('#aita');try{await navigator.clipboard.writeText(ta.value);toast('已複製提示詞')}catch(err){ta.select();toast('請按 Ctrl+C 複製')}return}
 });
 document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='fx'&&t.files[0]){await importFile(t.files[0]);t.value=''}
  else if(t.id==='fp'&&t.files.length){const r=await addPhotos([...t.files]);t.value='';saveStore();renderAll();toast(`已對應 ${r.ok.length} 張照片${r.miss.length?`；未對應：${r.miss.join('、')}`:''}`)}
  else if(t.id==='fk'&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());if(d.format!=='orid-workbench')throw new Error('不是 ORID 專案包');if(!await ask('這會用專案包取代目前專案的所有資料。確定還原嗎？','還原'))return;S=newStore();ORDER.forEach(sh=>Object.assign(S.tables[sh],(d.tables||{})[sh]||{}));S.photos=d.photos||{};S.log=d.log||[];PREV=null;saveStore();renderAll();toast('已還原專案包')}catch(err){toast('專案包讀取失敗：'+err.message)}t.value=''}
  else if(t.id==='fpt'&&t.files.length){const r=await addPhotos([...t.files]);t.value='';saveStore();renderAll();toast(`已對應 ${r.ok.length} 張照片${r.miss.length?`；未對應：${r.miss.join('、')}`:''}`)}
  else if(t.dataset&&(t.dataset.up||t.dataset.tup)&&t.files[0]){t.dataset.up=t.dataset.up||t.dataset.tup;const f=t.files[0];if(!/^image\//.test(f.type)){toast('請選擇圖片檔');return}S.photos[t.dataset.up]=await resizeImg(f);S.log.push({id:'B-'+String(S.log.length+1).padStart(3,'0'),at:new Date().toISOString(),file:'照片',kind:'photo',new:{},chg:{[/^M-/.test(t.dataset.up)?'Team':'Personas']:[t.dataset.up]},retired:[],warn:0,err:0});saveStore();renderAll();toast('已更新照片')}
  else if(t.id==='aish'){ST.aiSheet=t.value;$('#aita').value=aiPrompt(ST.aiSheet)}
  else if(t.id==='dbr'){ST.dbr=t.checked;drawDB()}});
 document.addEventListener('input',e=>{if(e.target.id==='q'){ST.dbq=e.target.value;drawDB()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#drw').hidden=true;closeModal()}});
 window.addEventListener('hashchange',()=>showTab((location.hash||'').slice(1)));
}
async function init(){
 $('#tabs').innerHTML=TABS.map(([k,z,en])=>`<button role="tab" data-t="${k}" aria-selected="false">${z}<small>${en}</small></button>`).join('');
 const saved=await loadStore();if(saved&&saved.tables){S=newStore();ORDER.forEach(sh=>Object.assign(S.tables[sh],saved.tables[sh]||{}));S.photos=saved.photos||{};S.log=saved.log||[]}
 bind();renderAll();showTab((location.hash||'').slice(1))}
init();
</script>
</body>
