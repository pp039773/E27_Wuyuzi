<html lang="zh-Hant" translate="no">
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>烏金預約服務設計 App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky stage-tab header; each tab = one Double Diamond stage with its PDF tools in order; shared coded-ID chips open a drawer */
:root{--bg:#EDF1F5;--s:#FFFFFF;--s2:#F4F7FA;--fg:#1E2B38;--mu:#5A6B7B;--ln:#D3DCE5;--pri:#4E7396;--pd:#34526F;--ps:#DDE7F0;--acc:#D9822B;--as:#FBECDC;--good:#3C8A68;--bad:#C0504A;--warn:#B07A1F;
--c-P:#34526F;--c-I:#66788A;--c-PN:#C0504A;--c-IN:#4E7396;--c-OP:#2F8F83;--c-ID:#7566A8;--c-HY:#A9812A;--c-GN:#4F9A62;--c-SV:#A25C86;
--sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--serif:'Noto Serif TC','Songti TC',serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--onpd:#fff;--sticky:#F6E9A8;--sh:0 1px 2px rgba(30,43,56,.06),0 6px 18px rgba(30,43,56,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A23;--s:#19232E;--s2:#1F2B37;--fg:#E4EBF2;--mu:#9AAABB;--ln:#2D3B49;--pri:#8DB1D0;--pd:#A9C6DE;--ps:#24384A;--acc:#EBA05A;--as:#3A2C1D;--good:#6CC49A;--bad:#E58A82;--warn:#D8B35D;
--c-P:#9DB9D3;--c-I:#9AA9B8;--c-PN:#E58A82;--c-IN:#8DB1D0;--c-OP:#5FC0B3;--c-ID:#A99BD8;--c-HY:#D8B35D;--c-GN:#84C494;--c-SV:#D58BB5;--onpd:#111A23;--sticky:#D9C978;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111A23;--s:#19232E;--s2:#1F2B37;--fg:#E4EBF2;--mu:#9AAABB;--ln:#2D3B49;--pri:#8DB1D0;--pd:#A9C6DE;--ps:#24384A;--acc:#EBA05A;--as:#3A2C1D;--good:#6CC49A;--bad:#E58A82;--warn:#D8B35D;
--c-P:#9DB9D3;--c-I:#9AA9B8;--c-PN:#E58A82;--c-IN:#8DB1D0;--c-OP:#5FC0B3;--c-ID:#A99BD8;--c-HY:#D8B35D;--c-GN:#84C494;--c-SV:#D58BB5;--onpd:#111A23;--sticky:#D9C978;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.7 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--s)}
.wrap{max-width:1160px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3,h4,h5,p{margin:0}
h1,h2{font-family:var(--serif);text-wrap:balance;line-height:1.3}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--s);border-bottom:1px solid var(--ln)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pd);display:grid;place-items:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;padding:8px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;white-space:nowrap;color:var(--mu);font-weight:500}
nav.tabs button small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;opacity:.8}
nav.tabs button[aria-selected=true]{background:var(--ps);color:var(--pd);font-weight:700}
nav.tabs button:hover{background:var(--s2)}
@media(max-width:760px){.brand span{display:none}}
main{padding-block:28px 56px}
.tab[hidden]{display:none}
.hero{display:grid;gap:14px;margin-bottom:26px}
.eyebrow{font:500 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pri)}
.hero h1{font-size:clamp(26px,4.2vw,40px)}
.hero p.lead{max-width:62ch;color:var(--mu);font-size:16px}
.dia{display:flex;gap:6px;align-items:center}
.dia i{width:12px;height:12px;background:var(--pri);transform:rotate(45deg);border-radius:2px;opacity:.35}
.dia i.on{opacity:1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;min-width:96px}
.tile b{display:block;font:700 22px/1.2 var(--serif);color:var(--pd)}
.tile span{font-size:12px;color:var(--mu)}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.jump button{border:1px solid var(--ln);background:var(--s);border-radius:999px;padding:6px 14px;font-size:13px}
.jump button:hover{border-color:var(--pri);color:var(--pd)}
.jump b{font:500 11px var(--mono);color:var(--pri);margin-right:6px}
article.tool{background:var(--s);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);padding:clamp(16px,2.6vw,28px);margin-bottom:22px;scroll-margin-top:84px;min-width:0}
.th{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:start;margin-bottom:14px}
.tn{font:500 12px/1 var(--mono);color:#fff;background:var(--pri);border-radius:6px;padding:6px 8px;margin-top:4px}
.th h2{font-size:clamp(20px,2.6vw,26px)}
.th .en{grid-column:2;color:var(--mu);font-size:13px;margin-top:-4px}
.pdf{font:500 11px/1 var(--mono);color:var(--mu);border:1px dashed var(--ln);border-radius:6px;padding:5px 7px;white-space:nowrap}
.what{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:18px}
@media(max-width:760px){.what{grid-template-columns:1fr}.th{grid-template-columns:auto 1fr}.pdf{grid-column:2;justify-self:start}}
.what div{background:var(--s2);border-radius:10px;padding:10px 14px;font-size:14px}
.what b{display:block;font-size:11px;letter-spacing:.1em;color:var(--pri);margin-bottom:2px}
.sub{font-size:16px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub:first-child{margin-top:0}
.card{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;min-width:0}
.card.w{background:var(--s)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:13.5px;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--s);color:var(--pd);font-weight:700;box-shadow:var(--sh)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.cd{font:500 11.5px/1 var(--mono);padding:4px 6px;border-radius:6px;border:1px solid color-mix(in srgb,var(--cc) 38%,transparent);background:color-mix(in srgb,var(--cc) 11%,var(--s));color:var(--cc);white-space:nowrap;vertical-align:1px}
button.cd:hover{background:color-mix(in srgb,var(--cc) 22%,var(--s))}
.t-P{--cc:var(--c-P)}.t-I{--cc:var(--c-I)}.t-PN{--cc:var(--c-PN)}.t-IN{--cc:var(--c-IN)}.t-OP{--cc:var(--c-OP)}.t-ID{--cc:var(--c-ID)}.t-HY{--cc:var(--c-HY)}.t-GN{--cc:var(--c-GN)}.t-SV{--cc:var(--c-SV)}
.cds{display:inline-flex;flex-wrap:wrap;gap:4px}
ul.l{margin:6px 0 0;padding-left:1.15em;display:grid;gap:3px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border:1px solid var(--ln);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--ps);color:var(--pd);font-weight:700}
.sc{overflow-x:auto;max-width:100%}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:color-mix(in srgb,var(--good) 16%,var(--s));color:var(--good)}
.b-no{background:color-mix(in srgb,var(--bad) 14%,var(--s));color:var(--bad)}
.b-mid{background:color-mix(in srgb,var(--warn) 16%,var(--s));color:var(--warn)}
.call{border-left:3px solid var(--acc);background:var(--as);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px}
.call.pri{border-color:var(--pri);background:var(--ps)}
.quote{font-family:var(--serif);font-size:15.5px;line-height:1.7}
.note{background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:13.5px;display:grid;gap:4px}
.note.p{border-left:3px solid var(--c-PN)}.note.g{border-left:3px solid var(--c-GN)}
/* avatar */
.av{position:relative;border-radius:50%;background:var(--ps);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--pri)}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:168px;height:168px;border:3px solid var(--s);box-shadow:0 0 0 2px var(--pri)}
.av.mid{width:64px;height:64px}.av.sm{width:40px;height:40px;font-size:15px;font-weight:700}
.av .sil{width:62%;height:62%;opacity:.55}
.av label{position:absolute;inset:0;cursor:pointer;display:grid;align-items:end;justify-items:center;background:linear-gradient(transparent 60%,rgba(20,32,44,.55));color:#fff;font-size:11px;padding-bottom:12px;opacity:0;transition:opacity .15s}
.av:hover label,.av label:focus-within{opacity:1}
.av input{position:absolute;opacity:0;pointer-events:none}
/* persona */
.pcard{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.pcard{grid-template-columns:1fr}}
.pl{background:var(--ps);border-radius:16px;padding:22px 18px;display:grid;gap:12px;justify-items:center;text-align:center}
.pl h3{font:700 24px/1.2 var(--serif)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.stats div{background:var(--s);border-radius:10px;padding:8px 4px}
.stats b{display:block;font:700 15px/1.2 var(--serif);color:var(--pd)}
.stats span{font-size:11px;color:var(--mu)}
.pr{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:620px){.pr{grid-template-columns:1fr}}
.pr .full{grid-column:1/-1}
.pr h5{font-size:11.5px;letter-spacing:.1em;color:var(--pri);margin-bottom:4px}
.jt{background:var(--pd);color:var(--onpd);border-radius:12px;padding:14px 16px}
.jt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:12.5px}
.jt3 div{background:color-mix(in srgb,var(--onpd) 16%,transparent);border-radius:8px;padding:6px 8px}
.jt3 b{display:block;font-size:11px;opacity:.8;font-weight:500}
.pn-line{display:flex;gap:8px;align-items:baseline;font-size:13.5px;margin-top:5px}
/* journey */
.jm{display:grid;grid-template-columns:30px 92px repeat(5,minmax(132px,1fr));gap:0;min-width:900px;font-size:13px;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--s)}
.jm>div{padding:9px 10px;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);min-width:0;display:flex;flex-direction:column;gap:6px}
.jm .zr{writing-mode:vertical-rl;text-orientation:mixed;align-items:center;justify-content:center;font:500 10.5px var(--mono);letter-spacing:.14em;color:#fff;background:var(--pri);padding:6px 0;text-transform:uppercase}
.jm .zr.c{background:var(--pd)}
.jm .rl{background:var(--s2);font-weight:700;font-size:12px;color:var(--pd);justify-content:center}
.jm .rl b{font:500 11px var(--mono);color:var(--pri)}
.jm .ph{background:var(--pd);color:var(--onpd);font-weight:700;align-items:center;justify-content:center;text-align:center}
.jm .ph small{font:500 10.5px var(--mono);opacity:.8}
.jm .zA{background:var(--s2)}
.jm .low{background:var(--as)}
.jm .opc{background:color-mix(in srgb,var(--c-OP) 9%,var(--s))}
.jm .cds{margin-top:auto}
.zhd{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--pri)}
.circ{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--pri);color:#fff;font:700 11px var(--mono);flex:none}
/* misc visuals */
svg text{font-family:var(--sans)}
.svgbox{overflow-x:auto;max-width:100%}
.note-y{background:var(--sticky);color:#2f2a10;border-radius:3px;padding:10px 12px;font-size:13.5px;box-shadow:0 2px 4px rgba(0,0,0,.12);display:grid;gap:6px;min-width:0}
.note-y.dim{opacity:.38}
.note-y.fin{outline:2px solid var(--c-OP)}

.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.tl{position:relative;display:grid;gap:0;margin-left:10px}
.tl>div{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--ln)}
.tl>div::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--s);border:3px solid var(--pri)}
.tl>div:last-child{border-left-color:transparent;padding-bottom:0}
.tl .k{font:500 11px var(--mono);letter-spacing:.1em;color:var(--pri);text-transform:uppercase}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.flow .bx{flex:1 1 180px;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:13.5px}
.flow .ar{align-self:center;color:var(--pri);font-weight:700}
.rng{display:grid;gap:4px;margin-bottom:8px}
.rng label{display:flex;justify-content:space-between;font-size:13.5px}
input[type=range]{width:100%;accent-color:var(--pri)}
.rr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.gauge{height:10px;border-radius:5px;background:var(--ps);position:relative;margin:10px 0 4px}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--good)}.gauge i.low{background:var(--bad)}
.gauge u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.bmc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;font-size:13px}
.bmc>div{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;min-width:0}
.bmc h5{font-size:11.5px;letter-spacing:.08em;color:var(--pri);margin-bottom:4px}
.bmc .kp{grid-column:span 2;grid-row:span 2}.bmc .ka{grid-column:span 2}.bmc .kr{grid-column:span 2}.bmc .vp{grid-column:span 2;grid-row:span 2;background:var(--ps)}
.bmc .cr{grid-column:span 2}.bmc .ch{grid-column:span 2}.bmc .cs{grid-column:span 2;grid-row:span 2}.bmc .cost{grid-column:span 5}.bmc .rev{grid-column:span 5}
@media(max-width:860px){.bmc{grid-template-columns:1fr 1fr}.bmc>div{grid-column:auto!important;grid-row:auto!important}}
.vpc{display:grid;grid-template-columns:minmax(0,1.2fr) 132px minmax(0,1fr);gap:10px;align-items:center}
@media(max-width:860px){.vpc{grid-template-columns:1fr}}
.vm{border:2px solid var(--pri);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;min-height:260px;background:var(--s)}
.vm>div{padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.vm .ps{grid-row:1/3;border-right:2px solid var(--pri);background:color-mix(in srgb,var(--c-SV) 7%,var(--s))}
.vm .gc{border-bottom:2px solid var(--pri)}
.vm h5{font-size:11.5px;color:var(--pri);letter-spacing:.06em}
.fitwrap{display:flex;align-items:center;justify-content:center;gap:2px}.fa{display:flex}.fa.a2 svg{transform:scaleX(-1)}.fit{flex:none;width:56px;height:56px;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;display:grid;place-items:center;margin:auto;font-size:16px}
.vpr{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.sb{display:grid;grid-template-columns:96px repeat(5,minmax(150px,1fr));min-width:860px;font-size:13px;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--s)}
.sb>div{padding:8px 10px;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);min-width:0}
.sb .h{background:var(--pd);color:var(--onpd);font-weight:700;display:flex;flex-direction:column;gap:5px}
.sb .rl{background:var(--s2);font-weight:700;color:var(--pd);font-size:12px}
.sb .line{grid-column:1/-1;padding:2px 10px;font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--acc);background:var(--as);border-bottom:1px dashed var(--acc)}
.sbf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media(max-width:980px){.sbf{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.sbf{grid-template-columns:repeat(2,minmax(0,1fr))}}
.frame{background:var(--s);border:1px solid var(--ln);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.frame .pic{background:var(--ps);aspect-ratio:4/3;display:grid;place-items:center;position:relative;color:var(--pri)}
.frame .pic svg{width:56%;max-height:78%}
.frame .pic b{position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--pd);color:#fff;display:grid;place-items:center;font:700 12px var(--mono)}
.frame .cp{padding:9px 10px;display:grid;gap:5px;font-size:12.5px;flex:1}
.frame h4{font-size:14px}
.dd{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
/* db */
.srch{width:100%;border:1px solid var(--ln);background:var(--s);color:var(--fg);border-radius:999px;padding:12px 20px;font:inherit;font-size:15px}
.dbr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.dbr:hover{border-color:var(--pri)}
.dbr .t{font-size:14.5px}
.dbr .n{font-size:12px;color:var(--mu);white-space:nowrap}
.dbg{display:grid;gap:8px;margin-bottom:22px}
.dbg h3{font-size:13px;color:var(--mu);letter-spacing:.08em;font-weight:700}
/* drawer */
#drw{position:fixed;inset:0;z-index:80;background:rgba(18,28,38,.45);display:flex;justify-content:flex-end}
#drw[hidden]{display:none}
#drw .pn{width:min(540px,100%);height:100%;overflow-y:auto;background:var(--s);padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:14px;align-content:start;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
#drw .x{justify-self:end;border:1px solid var(--ln);background:var(--s2);border-radius:8px;padding:5px 12px;font-size:13px}
#drw h3{font:700 20px/1.4 var(--serif)}
.back{display:inline-flex;margin-top:10px;font-size:13px;color:var(--pri);border:0;background:none;padding:0;text-decoration:underline}
.where{display:flex;flex-wrap:wrap;gap:6px}
.where button{border:1px solid var(--ln);background:var(--s2);border-radius:8px;padding:4px 10px;font-size:12.5px}
.where button:hover{border-color:var(--pri)}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--ln);font-size:12.5px;color:var(--mu);max-width:80ch}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}

<script type="application/json" id="data">{"meta":{"title":"南寮烏魚子漁民：從自產自銷到可被信任的服務系統","sub":"產地信任卡 × LINE 預購 × 冷鏈併單","course":"服務科學","school":"國立清華大學 EMBA","date":"2026/11/07","group":"第 ＿ 組","disclaimer":"本檔為「假想完成版」：所有受訪者、訪談內容、數字與 MVP 結果皆為示範用假設（受訪者為化名），非真實田野資料；場域、成員、時程與方法依本組期中提案草稿。"},"team":[{"n":"Forrest","full":"王建超","skill":"資訊系統、數位溯源","role":"訪談統籌／漁民訪談（問）","pair":1},{"n":"Jack","full":"簡建業","skill":"內控、稽核、合規","role":"漁民訪談（記）／食安標示合規","pair":1},{"n":"Van","full":"鍾貴智","skill":"IoT、產品規劃","role":"漁民＋冷鏈訪談（問）","pair":2},{"n":"Rod","full":"江文正","skill":"服務工程、售後營運","role":"漁民＋冷鏈訪談（記）／服務藍圖","pair":2},{"n":"Coco","full":"劉學璇","skill":"財富管理、高端人脈","role":"顧客訪談（問）","pair":3},{"n":"Peter","full":"陳祺昌","skill":"財務模型、利潤分析","role":"顧客訪談（記）／商業模式與試算","pair":3},{"n":"Alfred","full":"丁宥誠","skill":"能源開發、政府協商","role":"通路／漁會訪談（問）","pair":4},{"n":"Stanley","full":"袁建華","skill":"企業策略、新事業","role":"通路／漁會訪談（記）／簡報整合","pair":4}],"coreQuestion":"小漁民如何把「產地到餐桌的保鮮與信任」變成顧客願意付費的服務？","field":"新竹南寮漁港／竹北養殖烏魚子的老漁民；自產自銷的小漁民戶，主要在小店家、漁會、展售處銷售。","stages":[{"k":"discover","zh":"Discover 發現","goal":"走進場域，從人出發","tools":[{"n":"利害關係人地圖","what":"盤點服務系統中的行動者與互動強度，決定訪談哪些人","out":"10 個節點；v1 假設版 → v2 訪談後修正版"},{"n":"ORID 訪談設計","what":"事實→感受→詮釋→決定四層提問，先理解經驗再解釋經驗","out":"漁民／顧客／通路漁會三版題目，共訪 10 人"},{"n":"同理心地圖","what":"把訪談整理成 看到、聽到、說與做、想與感受、痛點、快樂點","out":"10 張，每張便利貼標註「誰說的＋say/see/do/think」"}]},{"k":"define","zh":"Define 定義","goal":"收斂出真正的問題","tools":[{"n":"Affinity 歸納","what":"把散落的便利貼依相似性分群，找出共同痛點","out":"4 群：信任落差、回饋斷鏈、旺季失控、導入門檻"},{"n":"Persona 與 JTBD","what":"由多位受訪者的共同特質組成假名角色與待完成工作","out":"供給端「海川伯」、需求端「王雅琪」"},{"n":"顧客旅程與情緒線","what":"把一個情境拆成階段，標出行動、想法、情緒低點與機會","out":"年節送禮 5 階段，情緒最低點在「收貨／保鮮」"}]},{"k":"develop","zh":"Develop 發展","goal":"發想、雛形、檢視 fit","tools":[{"n":"腦力激盪","what":"延後評判、接續他人想法，再用點票收斂","out":"10 個點子、24 點投票，收斂為 3 個服務"},{"n":"價值主張畫布 VPC","what":"左邊我們提供什麼，右邊對象要什麼，檢視是否對得上","out":"顧客版與提供者版各一張；v1 App＋IoT → v2 信任卡＋LINE"},{"n":"服務藍圖與 Fit 檢視","what":"把前台體驗與後台資源對應，並檢查是否過度或不足服務","out":"5 步驟藍圖；Fit 自評 v1 不通過 → v2 通過"}]},{"k":"deliver","zh":"Deliver 交付","goal":"商業模式與 MVP","tools":[{"n":"商業模式畫布 BMC","what":"九宮格定下客群、價值、通路、成本與收益","out":"v1 毛利 7.2% → v2 毛利 13.8%，損益兩平 200 盒"},{"n":"MVP 與 Pivot","what":"以最小可行方案驗證關鍵假說，依證據轉向","out":"3 個假說、2 輪驗證；客群 pivot 為福委優先"}]}],"sh":{"nodes":[{"id":"fisher","t":"漁民","ring":0,"v1":true,"v2":true,"iv":true},{"id":"cust","t":"終端顧客（個人／送禮）","ring":1,"v1":true,"v2":true,"iv":true},{"id":"shop","t":"展售店／小店家","ring":1,"v1":true,"v2":true,"iv":true},{"id":"assoc","t":"漁會","ring":1,"v1":true,"v2":true,"iv":true},{"id":"cold","t":"冷鏈／物流","ring":1,"v1":true,"v2":true,"iv":true},{"id":"corp","t":"企業福委／採購","ring":2,"v1":true,"v2":true,"ring2":1,"iv":true},{"id":"heir","t":"二代接班人","ring":1,"v1":false,"v2":true,"iv":true},{"id":"gov","t":"漁業署／地方政府","ring":2,"v1":true,"v2":true,"iv":false},{"id":"reg","t":"食安與標示法規","ring":2,"v1":false,"v2":true,"iv":false},{"id":"supply","t":"魚苗／飼料／加工","ring":2,"v1":true,"v2":true,"iv":false},{"id":"ecom","t":"電商平台","ring":2,"v1":true,"v2":false,"iv":false},{"id":"tour","t":"旅遊／觀光","ring":2,"v1":true,"v2":false,"iv":false}],"changes":[{"t":"企業福委由間接升為直接互動","why":"I-04：福委是批量、多址、重風險的決策者，影響顧客端設計","ev":["I-04"]},{"t":"新增「二代接班人」","why":"I-03：二代是實際操作 LINE、拍照與帳務的人，也是導入門檻的關鍵","ev":["I-03"]},{"t":"新增「食安與標示法規」","why":"Jack 內控檢視：產地、日期等標示涉及合規，須納入服務限制","ev":["I-08"]},{"t":"電商平台移出（暫不採用）","why":"I-01、I-02、I-03 都提到平台抽成與運費由漁民負擔，接受度低","ev":["I-01","I-02","I-03"]},{"t":"旅遊／觀光移出","why":"十位受訪者無人提及，沒有證據支持，先不納入","ev":[]}]},"orid":[{"k":"fisher","zh":"漁民版（供給端）","expect":"了解漁民從養殖到銷售的實際流程，找出他最困擾與最自豪的環節，以及他與通路、顧客之間的互動。","opening":"我們是清大 EMBA 的同學，想了解您養殖和賣烏魚子的日常，沒有對錯。您覺得不方便講的可以略過。","O":["這一季從開始養到賣出，實際做了哪些事？","上一次有人來買烏魚子是什麼時候？怎麼發生的？","主要賣給誰、在哪裡賣？定價怎麼決定？"],"R":["做這些事情當中，最開心的是哪一刻？","最讓您頭痛或心累的是哪一件事？","客人誇獎或抱怨時，當下的感覺是什麼？"],"I":["為什麼這件事對您這麼重要（或這麼困擾）？","客人買您的烏魚子，您覺得他們買的是什麼？","您怎麼看待漁會、展售店與您的關係？"],"D":["遇到這個困擾，您後來怎麼處理？","如果可以改變一件事，您最想改變什麼？","如果有人幫您處理銷售或保鮮，您希望他做什麼？（假設性題目放最後）"],"tips":["不一定講得出「感受」，用具體場景引導：「上一次賣不出去的那天，您怎麼過的？」","聽到抽象說法就追問例子；R 層別急著問為什麼","產量、收入等敏感數字不追問，用大概範圍代替","必要時用台語提問，題目準備好但不照念；同時觀察現場動作（先徵求同意拍照）"]},{"k":"cust","zh":"顧客版（需求端）","expect":"了解顧客從想買到吃完的實際經驗，找出最不放心與最滿意的環節，以及願意為什麼付費。","opening":"我們是清大 EMBA 的同學，想了解您購買和送禮烏魚子的經驗，沒有對錯，不方便講的可以略過。","O":["您上一次買烏魚子是什麼時候？自己吃還是送人？","怎麼知道這個賣家？比較過哪幾家、看了什麼資訊？","付了多少錢？怎麼下單、怎麼收到、怎麼保存？"],"R":["選購的過程中，最順利、最開心的是哪一刻？","有沒有讓您猶豫、擔心或不舒服的時刻？","打開包裝或看到對方收下時，感覺是什麼？"],"I":["您怎麼判斷這家烏魚子好不好、是不是真的？","對您來說烏魚子代表什麼（年節、心意、身分、口味）？","什麼情況您會覺得「值得這個價錢」？"],"D":["遇到不放心的地方，您後來怎麼處理？","下次還會買同一家嗎？會推薦朋友嗎？","如果直接向漁民買，您想知道什麼、需要什麼服務？（放最後）"],"tips":["先問最近一次的真實經驗，不問「您通常怎麼買」","送禮與自食分開問，送禮要追問「對方的反應」","D 層之前不提直購、溯源、冷鏈等構想，避免引導","注意說與做不一致：嘴上說看產地、實際看包裝，這種落差很有價值"]},{"k":"channel","zh":"通路／漁會版（通路端）","expect":"了解漁民的產品如何進入通路、通路扮演什麼角色，以及漁民與顧客之間的資訊與信任在哪裡斷掉。","opening":"我們是清大 EMBA 的同學，想了解漁民的烏魚子怎麼在您這裡銷售，不是要評論誰，想聽聽您的實際經驗。","O":["烏魚子怎麼上架或代售？從漁民送來到賣出經過哪些步驟？","合作的漁民有幾位？旺季是什麼時候？","顧客來詢問時通常問些什麼？怎麼回答？"],"R":["這一季漁民送來的貨，哪件事最讓您安心？哪件事最頭痛？","顧客抱怨或退貨時，您當下的感受是什麼？","旺季最忙的那一天是什麼樣子？"],"I":["漁會／店家在漁民與顧客之間扮演什麼角色？","為什麼有些事您不敢替漁民背書？","您覺得漁民與顧客之間，資訊在哪裡斷掉？"],"D":["遇到品質不一或客訴，您後來怎麼處理？","如果有新做法（產地資訊、預購、統一包裝），需要什麼條件您才願意試？","如果可以改變合作模式的一件事，您最想改變什麼？"],"tips":["漁會偏制度與公共性、店家偏營收，要分開記錄","先問流程再問看法，聽到結論就追問最近一次的例子","抽成、價格敏感議題不追問；不替漁民或顧客辯護","注意通路握有顧客詢問與回饋，這是漁民缺少的，要特別問"]}],"orid_iter":[{"t":"通路版 R、I 兩層題目原誤貼顧客版內容","fix":"重寫為通路視角的題目（見通路版）","ev":"組內互看 10/21"},{"t":"漁民版 D 層「如果有 App 您會用嗎」屬假設性題目，答案可信度低","fix":"移到 D 層最後，並改為「如果有人幫您處理…，希望他做什麼」","ev":"組內互看 10/21"},{"t":"顧客版開場白誤寫成「想了解您養殖和賣…」","fix":"改為購買與送禮經驗開場","ev":"組內互看 10/21"},{"t":"原先預計訪 6–9 人","fix":"實際完成 10 人，補訪二代與冷鏈業者","ev":"10/28 訪談結案"}],"interviews":[{"id":"I-01","name":"阿義伯（化名）","type":"fisher","role":"竹北養殖漁民，65–70 歲","who":"自產自銷 35 年，熟客約六成，其餘在漁會展售","date":"10/25","place":"竹北魚塭","team":"Forrest（問）／Jack（記）","O":"每年 11 月底起分三批採收，熟客約六成，其餘在漁會展售；包裝與冷凍自己來。","R":"最開心是熟客來電說「今年還要」；最頭痛是旺季一天一堆單，還要被問真偽。","I":"好烏魚子是風和時間做出來的，這個價值客人看不到，只能靠人情。","D":"有人幫我處理訂單和回饋我願意；但不要天天填表，也不要被平台抽成。","say":"我的烏魚子是九降風吹出來的，客人吃一次就知道；問題是第一次來的人不信我。","see":"展售攤位旁擺著進口魚子，價格只有一半","hear":"漁會說：展期只有兩個月，客人問產地我們答不上","think":"好東西靠熟客傳；上網賣太麻煩、怕被抽成","pain":[{"t":"客人說鹹，我卻不知道是誰、冷凍多久，沒人回來告訴我","k":"feedback"},{"t":"旁邊的進口魚子賣一半價，客人分不出來","k":"trust"}],"gain":"老客人年年來電，一句「還是你的好」就值了"},{"id":"I-02","name":"海生叔（化名）","type":"fisher","role":"南寮漁港店面漁民，50–55 歲","who":"自家小店面加 LINE 熟客，一季約 150 盒","date":"10/25","place":"南寮漁港店面","team":"Van（問）／Rod（記）","O":"店面加 LINE 熟客，年節前訂單記在紙本，寄冷凍宅配，一季約 150 盒。","R":"年節前最焦慮，LINE 一天上百則；被客人罵解凍破損最難受。","I":"客人買的是放心，但出狀況責任全在我，運費也是我貼。","D":"想要一個統一接單的地方，宅配最好有人幫忙包。","say":"年節前 LINE 訊息一堆，我手慢，單子記在紙上，常常漏掉。","see":"年前紙本訂單堆在櫃檯，電話與 LINE 同時響","hear":"客人在 LINE 說：收到時是軟的","think":"系統太複雜我學不會，但一個固定入口我願意","pain":[{"t":"寄冷凍宅配，破損、解凍被罵，運費我貼","k":"peak"},{"t":"訂單記紙本，旺季常漏單","k":"peak"}],"gain":"客人拍照說今年特別好吃，我整天心情都好"},{"id":"I-03","name":"小琪（化名）","type":"fisher","role":"返鄉二代，30–35 歲","who":"竹科工作五年後返鄉，負責拍照、LINE 與帳務","date":"10/26","place":"南寮（視訊加現場）","team":"Van（問）／Rod（記）","O":"在竹科工作五年，去年返鄉幫忙；負責拍照、LINE、帳務，爸爸不放心交給系統。","R":"想接棒但焦慮：怕做了一堆系統，爸爸根本不用。","I":"品質沒問題，缺的是讓人信任的證據與好用的流程；平台抽成會吃掉利潤。","D":"願意當窗口，每天十分鐘以內；希望漁會與其他漁民一起。","say":"我可以幫忙拍照、記錄，但不要每天都要填表。","see":"爸爸用紙筆記帳，年輕客人用 IG 找貨","hear":"網路賣要抽 15%，還要自己出運費","think":"要有爸爸能接受的做法，否則我沒辦法留下來接棒","pain":[{"t":"想導入數位工具，但爸爸不信任、同業也不願一起做","k":"barrier"}],"gain":"看到爸爸的魚子被年輕客人稱讚，覺得回來值得"},{"id":"I-04","name":"王經理（化名）","type":"cust","role":"竹科企業行政採購／福委，40–45 歲","who":"每年挑 40–60 份客戶禮，需發票與多址配送","date":"10/26","place":"竹科辦公室","team":"Coco（問）／Peter（記）","O":"每年年底挑 40–60 份客戶禮，上次向三家廠商訂；需發票、多址配送、年前到貨。","R":"最怕客戶問「這真的是新竹的嗎」答不出來；收到破損會被主管盯。","I":"禮物代表公司用心，要有故事也要有證明，出事沒有退路。","D":"願意多付約一成換來源證明與準時到貨；希望一次下單多個地址。","say":"送客戶要有故事、有證明，不能出事。","see":"各家廠商的禮盒包裝很像，標示不一","hear":"同事說：去年那盒好鹹，不知道真的假的","think":"價格不是第一，風險才是","pain":[{"t":"上次廠商送的不知道真假，被客戶問倒","k":"trust"},{"t":"多址配送要重複填，到貨日不確定","k":"peak"}],"gain":"客戶回信說「很有心意」，今年預算就好申請"},{"id":"I-05","name":"陳太太（化名）","type":"cust","role":"個人送禮者（送長輩），50–55 歲","who":"年節為岳父母買兩盒","date":"10/27","place":"新竹市咖啡廳","team":"Coco（問）／Peter（記）","O":"去年在百貨快閃攤買兩盒送岳父母，看包裝和店名；回家後不知道怎麼切。","R":"買的時候緊張，怕買貴買錯；吃的時候婆婆說太鹹。","I":"送烏魚子是年節心意，怕失禮。","D":"下次想買熟悉的店；希望附切法與吃法。","say":"我不會看烏魚子，只看包裝跟店家名聲。","see":"櫃上價差從幾百到上萬","hear":"店員說「這是正港新竹的」，但沒有憑據","think":"貴的不一定好，但不敢買便宜的","pain":[{"t":"收到不知道怎麼解凍、怎麼切，婆婆說太鹹","k":"trust"}],"gain":"婆婆說今年的好吃，大家都開心"},{"id":"I-06","name":"李先生（化名）","type":"cust","role":"退休老饕（自食），60–65 歲","who":"每年買 2–3 對，固定比較三家","date":"10/27","place":"住家附近","team":"Coco（問）／Peter（記）","O":"每年買 2–3 對，固定向三家購買比較口感；不知道各家冷凍多久。","R":"買到好的很興奮，遇到乾硬很失望。","I":"烏魚子是風土和手藝的結晶，想知道哪一塭、哪一年。","D":"願意付高一點買能指名的；想直接跟漁民聊聊。","say":"我願意付高一點，但要知道是哪一塭、哪一年。","see":"賣場標示只寫「新竹」","hear":"朋友說某家摻了進口魚子","think":"好壞靠自己舌頭，但被騙過","pain":[{"t":"買了不知道冷凍多久，風味差很多","k":"trust"}],"gain":"跟漁民聊九降風，買得很有故事"},{"id":"I-07","name":"Kelly（化名）","type":"cust","role":"竹科工程師、年輕送禮者，30–35 歲","who":"去年第一次網購年節禮","date":"10/28","place":"線上訪談","team":"Coco（問）／Peter（記）","O":"去年第一次買，上網看評價，下單後等了兩週，到貨日一直變。","R":"不確定買對沒有，等待很焦慮。","I":"想買有特色的台灣禮，可是不會判斷。","D":"想先預訂、固定到貨日；手機就能完成。","say":"我想買但不知道怎麼挑，網路評價看不出真偽。","see":"IG 上都是開箱，沒有產地資訊","hear":"同事推薦某某老店","think":"能預訂、日期準就好","pain":[{"t":"下單後到貨日一直變，沒人通知","k":"peak"},{"t":"網路評價看不出真偽","k":"trust"}],"gain":"預訂完成收到確認訊息，很安心"},{"id":"I-08","name":"周小姐（化名）","type":"channel","role":"漁會展售窗口","who":"負責展售期三十多位漁民供貨","date":"10/24","place":"漁會展售中心","team":"Alfred（問）／Stanley（記）","O":"展售期約兩個月，三十多位漁民供貨，客人最常問產地、鹹度、保存；收款後漁民自己出貨。","R":"客人問問題答不出來最尷尬；怕替商品背書（擔保）後出問題。","I":"漁會有公信力，但不能替每戶品質打包票；缺統一規格。","D":"願意提供場地與 QR 公告、協助彙整，但責任要清楚。","say":"顧客問產地、鹹度，我們答不出來。","see":"展售台上每戶的標示格式都不同（產地、日期、鹹度的寫法不一）","hear":"客人抱怨「說明太少」","think":"要有一套大家都照做的制度，漁會才敢替商品擔保","pain":[{"t":"漁民品質不一，我們不敢背書太多","k":"trust"},{"t":"客人的詢問我們都聽到，但沒有管道傳給漁民","k":"feedback"}],"gain":"有穩定供貨、誠實的漁民，客人會回頭找我們"},{"id":"I-09","name":"吳老闆（化名）","type":"channel","role":"南寮漁港展售店老闆","who":"代售約 10 戶漁民","date":"10/24","place":"南寮漁港展售店","team":"Alfred（問）／Stanley（記）","O":"代售約 10 戶，抽成約一成多（受訪者自述的大概範圍）；年前一週訂單爆量，包裝人力不夠。","R":"客人問哪家好我答不出來；退貨最傷。","I":"通路賣的是信任，但信任來自漁民，不是我。","D":"希望有統一包裝規格與標示，淡季也要有客人。","say":"客人問哪家的好，我只能說都好；退貨我吃虧。","see":"過年前一週店內擠滿人，包裝區堆滿紙箱","hear":"客人說：上次買的不一樣","think":"淡季撐不住，只能靠年節","pain":[{"t":"過年前一週訂單爆量，包裝人力不夠","k":"peak"},{"t":"客人問哪家好，我無從證明","k":"trust"}],"gain":"客人回頭說「你推薦的真的好」，很有成就感"},{"id":"I-10","name":"郭先生（化名）","type":"channel","role":"在地冷凍宅配業者","who":"年節旺季承接烏魚子等冷凍貨","date":"10/28","place":"業者倉庫","team":"Van（問）／Rod（記）","O":"烏魚子需全程 -18°C；年節期間小量單箱成本高；跨縣市需 24–48 小時。","R":"沒有溫度紀錄，客人一投訴，就說不清是哪一段出了問題，責任歸屬最麻煩。","I":"冷鏈穩定的關鍵是出貨前預冷與紀錄，不是貴的設備。","D":"願意併單與固定取貨點換取量；可提供溫度標籤。","say":"沒有溫度紀錄，客人一投訴，就說不清是哪一段出了問題。","see":"小量單箱在宅配站被當一般貨","hear":"漁民說：運費太貴","think":"小量單箱運費高，把訂單併在一起出貨，我們才有利潤","pain":[{"t":"小量單箱運費高，旺季更難排車","k":"peak"},{"t":"出問題不知道是哪一段斷了冷鏈","k":"feedback"}],"gain":"固定取貨點、集中出貨，我們排車就順"}],"clusters":[{"k":"trust","t":"信任落差","d":"好不好、真不真，客人看不出來；漁民說了也沒人信","key":true},{"k":"feedback","t":"回饋斷鏈","d":"客訴、詢問、冷鏈狀況沒有回到漁民手上","key":true},{"k":"peak","t":"旺季失控","d":"產季約 60 天、訂單集中，接單、包裝與冷鏈來不及","key":true},{"k":"barrier","t":"導入門檻","d":"老漁民不用複雜系統，二代時間有限（設計約束，不是要解的痛點）","key":false}],"compare":{"rows":["最大痛點","最大快樂點","金句"],"cols":[{"t":"漁民（供給端）","v":["好東西沒人信、客訴也傳不回來","熟客年年回購、被肯定","「第一次來的人不信我。」I-01"]},{"t":"顧客（需求端）","v":["看不出真偽，也不知道怎麼保存食用","送禮被稱讚有心意","「要有故事、有證明，不能出事。」I-04"]},{"t":"通路／漁會","v":["客人一直問，卻答不出來也傳不出去","有誠實穩定的供貨戶，客人回頭","「顧客問產地、鹹度，我們答不出來。」I-08"]}],"insight":"三方痛點互補：漁民缺顧客的回饋，顧客缺漁民的證明，通路握有詢問卻不能轉達。斷點不在品質，而在「信任與資訊沒有流動」。"},"ideas":[{"c":"ID-01","t":"產地信任卡（QR＋紙卡）","v":6,"fin":"SV-1","ln":["OP-01"]},{"c":"ID-02","t":"全程數位溯源 App＋IoT 溫控","v":5,"fin":"v1","ln":["OP-01"]},{"c":"ID-03","t":"LINE 官方帳號預購單＋到貨日提醒","v":5,"fin":"SV-2","ln":["OP-02"]},{"c":"ID-04","t":"統一冷鏈併單＋溫度標籤","v":3,"fin":"SV-3","ln":["OP-04","OP-07"]},{"c":"ID-05","t":"漁塭認養／產季期貨制","v":2,"fin":"","ln":["OP-08"]},{"c":"ID-06","t":"解凍與切法影片＋食用建議","v":1,"fin":"SV-3","ln":["OP-05"]},{"c":"ID-07","t":"主廚聯名禮盒","v":1,"fin":"","ln":[]},{"c":"ID-08","t":"企業福委專案團購","v":1,"fin":"pivot","ln":["OP-03"]},{"c":"ID-09","t":"電商平台上架","v":0,"fin":"","ln":[]},{"c":"ID-10","t":"漁會 QR 公告牆","v":0,"fin":"","ln":["OP-09"]}],"vpc":{"cust":{"jobs":["年節送出有面子的禮","多址批量配送、開發票報帳"],"pains":[["P1","真偽不明"],["P2","到貨日與溫度不確定"],["P3","不知道怎麼保存食用"],["P4","出事無人負責"]],"gains":[["G1","有故事可轉述"],["G2","準時、一次搞定"],["G3","收禮人被重視"]]},"prov":{"jobs":[" <script type="application/json" id="data1">{"interviews": [{"id": "I-01", "name": "林總（化名）", "type": "cust", "role": "企業負責人／送禮採購者（送重要客戶），50–55 歲", "who": "企業負責人／送禮採購者（送重要客戶），50–55 歲", "date": "", "place": "", "team": "", "O": "", "R": "", "I": "", "D": "", "say": "送重要客戶的禮，限定給台灣人，因為外國人大多不喜歡這個味道。", "see": "", "hear": "", "think": "", "pain": [], "gain": "", "qs": {"O": [{"c": "I-01.O1", "t": "買過烏魚子，自己和家人都會買，吃的是自己喜歡的店家與口味。"}, {"c": "I-01.O2", "t": "最近一次是年節送禮兼自用；送禮對象是重要客戶，而且限定台灣人，因為外國人大多不喜歡這個味道。"}, {"c": "I-01.O3", "t": "透過漁會推薦購買，因為漁會有權威性。"}, {"c": "I-01.O4", "t": "挑選時看品質，特別在意烏魚子的含鹽量與含水量。"}, {"c": "I-01.O5", "t": "這次買了 500 片，每片 1,000 元，價格包含運費。"}, {"c": "I-01.O6", "t": "從選購、付款到收貨都很順，沒有不順的地方。"}, {"c": "I-01.O7", "t": "整片的放冰箱保存，一口吃的打開就能吃；客戶收到禮物會來電感謝，他會順便問一下對方的收禮體驗。"}, {"c": "I-01.O8", "t": "不知道客戶有沒有把禮物吃完。"}], "R": [{"c": "I-01.R1", "t": "最滿意的是商業往來中，客戶能感受到公司的用心；好吃、送禮合適就是滿意的時刻。"}, {"c": "I-01.R2", "t": "最擔心品質不好，或是太鹹、味道客戶無法接受。"}, {"c": "I-01.R3", "t": "這些擔心目前沒有真正發生過。"}], "I": [{"c": "I-01.I1", "t": "理想的經驗是體面、方便、安心、好吃；客戶要知道這份禮物的價值，但也要考慮收禮的人會不會煎，不會煎的話就要送一口吃。"}, {"c": "I-01.I2", "t": "困擾來自料理：要把烏魚子外面的膜去除很麻煩。"}, {"c": "I-01.I3", "t": "現在的做法是依客戶的習慣，送不同類型的烏魚子。"}, {"c": "I-01.I4", "t": "如果只能先改善一件事，他會選擇改送一口吃。"}, {"c": "I-01.I5", "t": "為了這項改善，他願意改買一口吃。"}], "D": [{"c": "I-01.D1", "t": "下次遇到類似需求，他會選一口吃。"}, {"c": "I-01.D2", "t": "他認為料理麻煩這個問題，可以靠買一口吃來改善。"}, {"c": "I-01.D3", "t": "後續若有樣稿或服務流程，他願意再提供意見。"}, {"c": "I-01.D4", "t": "對訪談者整理的重點表示同意。"}]}, "em": {"say": [{"t": "送重要客戶的禮，限定給台灣人，因為外國人大多不喜歡這個味道。", "src": ["I-01.O2"]}, {"t": "客戶收到禮物會來電感謝，我會順便問一下他們的收禮體驗。", "src": ["I-01.O7"]}], "think": [{"t": "客戶知道禮物的價值，但也要考慮對方會不會煎；不會煎的話就要送一口吃。", "src": ["I-01.I1"]}], "hear": [{"t": "漁會推薦，而且漁會有權威性。", "src": ["I-01.O3"]}, {"t": "客戶來電感謝，並說出他們的收禮體驗。", "src": ["I-01.O7"]}], "pain": [{"t": "怕品質不好，或太鹹、味道客戶無法接受。", "src": ["I-01.R2"]}, {"t": "要把烏魚子外面的膜去除很麻煩。", "src": ["I-01.I2"]}], "gain": [{"t": "商業往來中，客戶能感受到公司的用心。", "src": ["I-01.R1"]}]}, "sil": "I-04", "srole": "送禮採購者", "src": "顧客1_送禮"}, {"id": "I-02", "name": "張小姐（化名）", "type": "cust", "role": "上班族／家中主要採買與料理者（自用、年節給長輩），40–45 歲", "who": "上班族／家中主要採買與料理者（自用、年節給長輩），40–45 歲", "date": "", "place": "", "team": "", "O": "", "R": "", "I": "", "D": "", "say": "先上網找評價較好的店家，最好是產地自售的。", "see": "", "hear": "", "think": "", "pain": [], "gain": "", "qs": {"O": [{"c": "I-02.O1", "t": "買過烏魚子，最近一次是過年，因為長輩喜歡。"}, {"c": "I-02.O2", "t": "家裡的烏魚子由受訪者自己購買，主要料理者也是受訪者。"}, {"c": "I-02.O3", "t": "購買前先上網找評價較好的店家，最好是產地自售的。"}, {"c": "I-02.O4", "t": "比較過價錢、重量、顏色與產地，最後決定的是顏色和產地。"}, {"c": "I-02.O5", "t": "忘記買了多少份量與金額，因為一年只買一次。"}, {"c": "I-02.O6", "t": "從選購、付款到收貨，沒有不順的地方。"}, {"c": "I-02.O7", "t": "收到後先冷凍保存，要吃時再拿出來；料理時先撕掉薄膜，用高粱酒浸泡，再小火煎到兩面微焦，配白蘿蔔與蒜苗。"}, {"c": "I-02.O8", "t": "買到的烏魚子都吃完了。"}, {"c": "I-02.O9", "t": "曾經考慮買但最後沒買，因為覺得品質和價錢不相符。"}], "R": [{"c": "I-02.R1", "t": "最滿意的是吃完後口感很好。"}, {"c": "I-02.R2", "t": "最猶豫的是網路購買時，還沒看到成品的那段時間；後來還是選網購，因為同事買過、評價還不錯。"}, {"c": "I-02.R3", "t": "這樣買不用另外花時間去找店家。"}], "I": [{"c": "I-02.I1", "t": "理想的經驗是方便，又能買到好品質的東西。"}, {"c": "I-02.I2", "t": "困擾的原因是第一次在網路上購買，不確定性太高；以後還是會選網路購買。"}, {"c": "I-02.I3", "t": "現在持續跟同一個賣家買，品質都很一致。"}, {"c": "I-02.I4", "t": "目前沒有一定要先改善的事項。"}], "D": [{"c": "I-02.D1", "t": "下次還是希望能先看到實物的品質，再決定購買。"}, {"c": "I-02.D2", "t": "希望店家提供一小片試吃品，不滿意可以退貨；這樣可能踩雷的機率會變低。"}, {"c": "I-02.D3", "t": "後續若有樣稿或服務流程，願意提供意見。"}, {"c": "I-02.D4", "t": "沒有其他補充。"}]}, "em": {"say": [{"t": "先上網找評價較好的店家，最好是產地自售的。", "src": ["I-02.O3"]}, {"t": "收到後先冷凍；吃的時候撕掉薄膜、用高粱酒浸泡，再小火煎到兩面微焦，配白蘿蔔與蒜苗。", "src": ["I-02.O7"]}], "think": [{"t": "網路購買還沒看到成品時最猶豫，第一次買不確定性太高。", "src": ["I-02.R2", "I-02.I2"]}], "see": [{"t": "比較價錢、重量、顏色與產地，最後看顏色和產地決定。", "src": ["I-02.O4"]}], "hear": [{"t": "同事買過、評價還不錯，所以後來選了網路購買。", "src": ["I-02.R2"]}], "pain": [{"t": "覺得品質和價錢不相符時，會決定不買。", "src": ["I-02.O9"]}], "gain": [{"t": "吃完後口感很好，也不用另外花時間去找店家。", "src": ["I-02.R1", "I-02.R3"]}]}, "sil": "I-05", "srole": "家中採買者", "src": "顧客2_自用"}, {"id": "I-03", "name": "黃先生（化名）", "type": "cust", "role": "企業中階主管／團購與聚餐的購買者（自用），45–50 歲", "who": "企業中階主管／團購與聚餐的購買者（自用），45–50 歲", "date": "", "place": "", "team": "", "O": "", "R": "", "I": "", "D": "", "say": "產品源頭一定要清楚、不妥協，否則寧願不買。", "see": "", "hear": "", "think": "", "pain": [], "gain": "", "qs": {"O": [{"c": "I-03.O1", "t": "有買過也有吃過，最近一次是三個星期前，朋友聚餐時餐廳的前菜就有烏魚子料理。"}, {"c": "I-03.O2", "t": "家裡通常由受訪者購買，也會協助處理配料，例如把蘋果削成片。"}, {"c": "I-03.O3", "t": "餐廳的烏魚子料理吃起來果然美味。"}, {"c": "I-03.O4", "t": "更早之前參加過團購：同學開團，賣家是同學買過的供應商。"}, {"c": "I-03.O5", "t": "選購時比較產地、口碑、重量與色澤，最後的決定點是重量與色澤。"}, {"c": "I-03.O6", "t": "買了 2 片，每片大約 900 元，品質還不錯。"}, {"c": "I-03.O7", "t": "同學開團買得很順利，因為同學以前買過。"}, {"c": "I-03.O8", "t": "收到後冷凍保存，解凍後用烤箱烤，再切片搭配蘋果和白蘿蔔片，口感順口美味。"}, {"c": "I-03.O9", "t": "因為多人食用，一片一次就吃完，大多數人的感想是美味居多。"}, {"c": "I-03.O10", "t": "曾經因為不了解產地而不敢買，主要原因是擔心品質。"}, {"c": "I-03.O11", "t": "送禮時，之前知道對方喜歡才會特別採買，也會想知道對方吃後的反應。"}], "R": [{"c": "I-03.R1", "t": "最滿意的是烤好後色澤明亮，以及大家滿足的表情。"}, {"c": "I-03.R2", "t": "在餐廳食用前，曾擔心口感不好會掃興；後來沒有發生，賓主盡歡。"}, {"c": "I-03.R3", "t": "這次經驗讓受訪者不再認為烏魚子很苦、不好吃，因為品質好，配料也好。"}], "I": [{"c": "I-03.I1", "t": "理想的經驗是安全又好吃，新鮮與滿意最重要。"}, {"c": "I-03.I2", "t": "困擾的原因是自己對烏魚子料理沒有那麼專業；解決方式是問人和上網查。"}, {"c": "I-03.I3", "t": "現在的做法是產品源頭一定要清楚、不妥協，否則寧願不買，這樣提高了買到好品質的機率。"}, {"c": "I-03.I4", "t": "如果只能先改善一件事，會多聽專家或有體驗過的朋友的意見，因為術業有專攻，多問可以減少出錯。"}, {"c": "I-03.I5", "t": "好東西貴一點仍然划算，價格不是第一考量。"}], "D": [{"c": "I-03.D1", "t": "下次會維持同樣的做法，因為有體驗過很重要。"}, {"c": "I-03.D2", "t": "希望賣家有更多烏魚子知識讓顧客了解，越了解就越知道烏魚子的好。"}, {"c": "I-03.D3", "t": "願意再提供意見，但希望事先告知，因為怕時間衝突。"}, {"c": "I-03.D4", "t": "認為差不多了，沒有想到其他問題。"}]}, "em": {"say": [{"t": "產品源頭一定要清楚、不妥協，否則寧願不買。", "src": ["I-03.I3"]}, {"t": "冷凍保存，解凍後用烤箱烤，切片搭配蘋果與白蘿蔔片。", "src": ["I-03.O8"]}], "think": [{"t": "好東西貴一點仍然划算，價格不是第一考量。", "src": ["I-03.I5"]}], "see": [{"t": "選購時比較產地、口碑、重量與色澤，最後看重量和色澤。", "src": ["I-03.O5"]}, {"t": "烤好後色澤明亮，大家一臉滿足。", "src": ["I-03.R1"]}], "hear": [{"t": "多聽專家或有體驗過的朋友的意見，可以減少出錯。", "src": ["I-03.I4"]}], "pain": [{"t": "不了解產地時不敢買，擔心品質。", "src": ["I-03.O10"]}], "gain": [{"t": "因為品質好、配料也好，不再覺得烏魚子很苦、不好吃。", "src": ["I-03.R3"]}]}, "sil": "I-06", "srole": "團購購買者", "src": "顧客3_自用"}, {"id": "I-04", "nam "資訊登錄與拍照人力（待估）", "印刷與影片製作（待估）", "物流（待估）"], "rev": ["整片與一口吃禮盒的產品銷售（價位參考：每片約 900–1,000 元，I-03、I-01）", "依規格組合的客製禮盒（待驗證）"], "v1note": "ORID_1.2st 初版：價格與成本目前沒有資料，不做損益試算；補訪漁民與通路取得數字後再算"}, "price": {"have": ["每片約 900 元（I-03.O6，團購）", "每片 1,000 元，含運費，一次 500 片（I-01.O5）", "好東西貴一點仍然划算，價格不是第一考量（I-03.I5）"], "need": ["賣家的成本與可接受售價", "試吃品與分裝的單位成本", "冷凍運送的運費與損耗", "資訊登錄與客服的人力"]}, "mvp": [{"h": "H1 看得見的產地與品質資訊，能讓第一次買的人更放心下單", "how": "附資訊卡與不附資訊卡兩組比較", "who": "10–15 位潛在顧客（含 P2 型）", "ok": "附卡一組明顯較願意下單（門檻待定）", "when": "補訪後約 2 週"}, {"h": "H2 先試吃，能降低網購踩雷的疑慮並促成購買", "how": "提供一口吃試吃包並訪談", "who": "8–10 位（P2、P3 型）", "ok": "多數人試吃後願意購買（門檻待定）", "when": "補訪後約 2 週"}, {"h": "H3 看到規格建議後，送禮者更有把握選對整片或一口吃", "how": "展示規格建議卡並訪談", "who": "5–8 位（P1 型）", "ok": "多數人更有把握且選擇相符", "when": "補訪後約 1–2 週"}, {"h": "H4 賣家（漁民或店家）負擔得起提供資訊卡與試吃的工作量", "how": "先訪談並請試填資訊卡", "who": "3 戶漁民、2 家店", "ok": "登錄時間與成本在可接受範圍（訪談後決定）", "when": "最先進行，約 2 週"}], "pivot": [["HY-01", "不成立：資訊卡沒有提高下單意願", "改把重點放在「人的推薦」：漁會背書與買家評價（ID-02、ID-10），而不是資料欄位。"], ["HY-02", "不成立：試吃後仍不買", "改成實物照與開箱影片（ID-03），並縮小試吃範圍，只給高意願顧客。"], ["HY-03", "不成立：規格建議沒有幫助", "收斂成單一的免料理一口吃禮盒（ID-09），讓送禮者不必選。"], ["HY-04", "不成立：賣家端負擔太重", "縮到只剩一張最少欄位的資訊卡，其他服務暫緩。"]], "qa": ["你們只訪談了 5 位顧客，樣本夠嗎？（這是探索性質：Discover 的目的是找出問題，所有結論都標了證據來源；下一輪補訪漁民、通路與更多顧客後才下定論。）", "還沒訪談漁民，怎麼知道他們做得到？（做不到時 Fit 檢視就是未驗證，所以把 HY-04 放在最先驗證，並預先寫好縮小服務的轉向方案。）", "外籍顧客不喜歡味道，客群怎麼界定？（IN-06：口味本身不是服務能改的，先以台灣顧客為主，P4 列為非目標客群。）", "試吃的成本誰承擔？（目前沒有成本資料，BMC 先標「待估」，補訪賣家與通路後再算。）"], "ask": ["四項服務裡，哪一項最可能是 over-service？", "供給端還沒訪談，我們是否應該先補訪再繼續設計？", "客群只鎖定台灣顧客，這個界定合理嗎？"], "vpc": {"P1": ["年節前，用不會出錯的方式送出重要客戶會滿意的禮", "選對整片或一口吃，並感受到對方的反應", "代表公司展現用心與體面"], "P2": ["在不是專家的情況下，買到來源清楚、品質穩定的烏魚子", "買之前就看得到實物或能試吃，不怕踩雷", "讓家人與長輩吃得開心"], "P3": ["把收到的烏魚子在年節吃得體面又不浪費", "需要送人時不會送錯口味", "用最簡單的方式料理（免料理或步驟簡單）"]}, "counts": {"ID": 12, "SV": 4, "HY": 4}}, "v13": {"interviews": [{"id": "I-06", "name": "受訪者 許主任", "type": "assoc", "role": "新竹區漁會推廣部主管（供給端：產業輔導與推廣單位）", "who": "新竹區漁會推廣部主管（供給端：產業輔導與推廣單位）", "date": "2026-11-04", "place": "新竹區漁會推廣部", "team": "專案小組", "O": "", "R": "", "I": "", "D": "", "say": "拔子窟烏魚子在全臺評比中一直名列前茅，特色是九降風天然風乾、海水養殖與養到三、四年。", "see": "", "hear": "", "think": "", "pain": [], "gain": "", "qs": {"O": [{"c": "I-06.O1", "t": "拔子窟養殖區的歷史可追溯到民國 86 年左右，當時政府推動沿海養殖漁業生產區，縣政府與新竹區漁會開始輔導當地漁民。"}, {"c": "I-06.O2", "t": "養殖區位在竹北沿海，魚塭面積約 62 公頃，目前有十幾戶養殖戶，多半是養了二三十年的資深養殖戶。"}, {"c": "I-06.O3", "t": "受訪者表示，拔子窟烏魚子靠每年農曆十月到十一月的東北季風「九降風」天然風乾，南部產地則主要靠日曬。"}, {"c": "I-06.O4", "t": "養殖用純淨海水，或維持在高比例海水的低鹽度環境，不是一般的淡水泥塘。"}, {"c": "I-06.O5", "t": "很多養殖戶堅持把烏魚養到第三年甚至第四年；養到第四年的魚可重達四五斤，一片烏魚子可做到六兩、七兩甚至八兩以上。"}, {"c": "I-06.O6", "t": "養殖戶在烏魚池裡同時混養白蝦，以及鱸魚或虱目魚；白蝦約三到四個月收成一批，一年可收三到四批，賣蝦的現金用來支付飼料、電費和家庭開銷。"}, {"c": "I-06.O7", "t": "烏魚收成集中在每年十一月中旬到十二月中旬約一個月，十幾戶養殖戶要在短短幾天內處理大量烏魚、取卵加工。"}, {"c": "I-06.O8", "t": "取卵後的烏魚殼和來不及曬製的新鮮魚卵，必須第一時間以負 40 度急速冷凍；但整個產銷班沒有一座大型公用的急速冷凍庫。"}, {"c": "I-06.O9", "t": "旺季時養殖戶自己的小型冷凍庫容量不夠，有些漁民只能低價把烏魚殼賣給中盤商。"}, {"c": "I-06.O10", "t": "新竹區漁會正向農業部漁業署爭取前瞻冷鏈經費，預計在漁會大樓旁興建冷鏈物流中心，由漁會統一營運、以優惠租金租給產銷班；順利的話希望明年或後年動工。"}, {"c": "I-06.O11", "t": "漁會輔導養殖戶通過產銷履歷與水質藥檢無毒檢驗，並發放產地安全封條。"}, {"c": "I-06.O12", "t": "產銷班十幾戶在銷售時各自獨立包裝、各自定價、各自建立銷售通路。"}, {"c": "I-06.O13", "t": "老一輩漁民多做熟客生意或整批賣給中盤商，每年收成前，老客人的訂單就已經打電話進來預訂。"}, {"c": "I-06.O14", "t": "有幾位青農接班後導入智慧養殖，在魚池裝物聯網水質監測探頭，用手機 App 監控水溫、溶氧量與酸鹼值。"}, {"c": "I-06.O15", "t": "青農研發了「一口烏」：把烏魚子炙燒後切成一口大小，單片真空氮氣包裝，撕開即食；受訪者表示這個產品在年輕市場和伴手禮通路很受歡迎。"}, {"c": "I-06.O16", "t": "受訪者表示，青農的烏魚子供應連鎖餐廳，也有星級餐廳指定使用。"}, {"c": "I-06.O17", "t": "漁會與縣政府每年十一月下旬在拔子窟舉辦竹北烏魚節，內容有烏魚子評鑑頒獎、千人料理品嚐、漁村健行與抓魚體驗。"}, {"c": "I-06.O18", "t": "漁會帶產銷班走進在地的小學和國中做食魚教育，教小朋友認識烏魚的一生、九降風，並親手體驗綁烏魚子。"}, {"c": "I-06.O19", "t": "目前觀光接待能力主要集中在合作餐廳周邊；一般魚塭以生產為主，缺少安全步道、遮陽設施和導覽動線。"}], "R": [{"c": "I-06.R1", "t": "受訪者對拔子窟烏魚子的品質感到驕傲，認為它在全臺評比中名列前茅，吃過的老饕嘴巴就變挑了。"}, {"c": "I-06.R2", "t": "漁會推廣部常在自我檢討：烏魚節帶來週末兩天的人潮，但活動一結束，平日的魚塭又很安靜。"}, {"c": "I-06.R3", "t": "看到青農回鄉接班，覺得這是拔子窟的新希望。"}, {"c": "I-06.R4", "t": "推廣食魚教育的資源有限，漁會推廣部人力不足，需要更多民間力量、學校與企業一起串聯。"}, {"c": "I-06.R5", "t": "聽到團隊的構想後覺得精采、很有商業邏輯，認為和以往只做問卷與報告的學校專案不同。"}, {"c": "I-06.R6", "t": "認為以往政府資源常投在煙火式的活動，團隊從使用者的用餐情境與採購決策切入，給了推廣部很大的啟發。"}], "I": [{"c": "I-06.I1", "t": "受訪者認為拔子窟烏魚子的特色來自風土：九降風天然風乾讓水分蒸散均勻，成品色澤琥珀金黃、組織紮實、口感 Q 彈，不死鹹也沒有土腥味。"}, {"c": "I-06.I2", "t": "外界一講到烏魚子，直覺就想到雲林口湖或南部；受訪者認為新竹其實一直名列前茅，只是知名度不及。"}, {"c": "I-06.I3", "t": "白蝦是養殖戶的日常現金流，像提款機；烏魚子在冬至前夕大收成，則是整年的大筆獲利。"}, {"c": "I-06.I4", "t": "受訪者認為最硬的痛點是冷鏈與急速冷凍設備短缺，導致無法做整年度的解凍調節與平穩供應。"}, {"c": "I-06.I5", "t": "品牌整合難，是因為各戶各自包裝、定價與建立通路，所以一直無法像大品牌那樣統購統銷或統一品牌行銷。"}, {"c": "I-06.I6", "t": "老一輩漁民覺得一年賣光就賺飽了，不想花心思改包裝，也排斥擺攤與經營電商，因為擺攤要站一整天，電商還要客服與退換貨，太繁瑣、太累。"}, {"c": "I-06.I7", "t": "年輕人和小家庭不常開伙，整片買回去不知道怎麼料理、怕麻煩，青農因此研發一口烏。"}, {"c": "I-06.I8", "t": "受訪者認為拔子窟正在轉變：老一輩守住熟客與傳統品質，新一代衝刺高附加價值、精品品牌與新興通路。"}, {"c": "I-06.I9", "t": "烏魚節只帶來一時的熱鬧，很難把一次性的活動人流轉化成持續性的產業消費或常態產地觀光。"}, {"c": "I-06.I10", "t": "受訪者認為團體以預約制、小團體深度體驗的方式接待是可行的：由合作餐廳提供餐飲與室內手作教室，由班長帶隊到魚塭走讀。"}], "D": [{"c": "I-06.D1", "t": "受訪者認為團隊的「體驗便當加校園小農展售」構想很有意思，願意由推廣部出面號召產銷班班長與合作餐廳。"}, {"c": "I-06.D2", "t": "受訪者建議本週四（11 月 5 日）下午直接到拔子窟現場：先到班長的魚塭與加工廠看烏魚池和曬魚場，再到合作餐廳討論便當的菜色、份量、成本結構與試菜時間。"}, {"c": "I-06.D3", "t": "受訪者表示合作餐廳的廚房量能足以供應到 100 個便當，並會請餐廳給專案優惠價格；目前還沒有提出實際價格。"}, {"c": "I-06.D4", "t": "清大校園的場地借用與攤位桌椅，要由團隊向學校單位申請；產銷班這邊由班長準備攜帶型展架、產銷履歷立牌、檢驗合格證書、展示樣品與試吃盤。"}, {"c": "I-06.D5", "t": "漁會官方 Facebook 粉絲專頁可以協助轉發團隊的海報與社群貼文。"}, {"c": "I-06.D6", "t": "如果便當與展售成功，可能發展出「企業福委會參訪與小農共創模式」，吸引竹科企業把家庭日或部門團建帶進拔子窟。"}]}, "em": {"say": [{"t": "拔子窟烏魚子在全臺評比中一直名列前茅，特色是九降風天然風乾、海水養殖與養到三、四年。", "src": ["I-06.R1", "I-06.I1"]}, {"t": "漁會輔導養殖戶做產銷履歷與水質藥檢，並發放產地安全封條。", "src": ["I-06.O11"]}], "think": [{"t": "烏魚節熱鬧兩天，卻很難變成持續的消費；推廣部常在自我檢討。", "src": ["I-06.R2", "I-06.I9"]}, {"t": "老一輩覺得一年賣光就賺飽，不想改包裝、擺攤或做電商。", "src": ["I-06.I6"]}], "see": [{"t": "旺季冷凍庫塞爆，有些漁民只能低價賣掉烏魚殼。", "src": ["I-06.O9"]}, {"t": "青農回來接班，導入智慧養殖，也做出一口烏。", "src": ["I-06.O14", "I-06.O15"]}, {"t": "活動結束後，平日的魚塭很安靜。", "src": ["I-06.R2"]}], "hear": [{"t": "外面的人一講到烏魚子，就想到雲林口湖或南部。", "src": ["I-06.I2"]}, {"t": "老客人在收成前就打電話預訂。", "src": ["I-06.O13"]}], "pain": [{"t": "沒有公用的急速冷凍庫，旺季保存不了，只能賤賣烏魚殼。", "src": ["I-06.O8", "I-06.O9"]}, {"t": "各戶各自包裝、定價與通路，無法統一品牌。", "src": ["I-06.O12", "I-06.I5"]}, {"t 單", "改成只做體驗與口碑：留下聯絡方式與回饋，後續再以規格建議與試吃（SV-02、SV-03）接續。"], ["HY-06", "不成立：資料取得或公開有困難", "先用漁會統一提供的產地說明與檢驗證書，逐步補欄位。"]], "qa": ["你們只訪談了 5 位顧客與 1 位漁會人員，樣本夠嗎？（這是探索性質：Discover 的目的是找出問題，所有結論都標了證據來源；漁會的說法也是單一來源的轉述，還要補訪漁民、店家與更多顧客。）", "漁會很支持，是否代表有需求？（不是。漁會的支持是口頭意願與配合安排，不能當成顧客需求或銷售證據；所以 HY-05 要在發表會當天做真實測試。）", "還沒有直接訪談漁民，怎麼知道他們做得到？（做不到時 Fit 檢視就是未驗證；HY-04、HY-06 先驗證，並預先寫好縮小服務的轉向方案。）", "外籍顧客不喜歡味道，客群怎麼界定？（IN-06：口味本身不是服務能改的，先以台灣顧客為主，P4 列為非目標客群。）", "便當與展售的成本誰承擔？（目前沒有成本資料，BMC 先標「待估」；餐廳尚未報價，待改期後的現場確認。）", "發表會的對象多是 EMBA 師生，能代表一般顧客嗎？（不能完全代表；結果只當第一次實測，之後再找一般顧客驗證。）"], "ask": ["五項服務裡，哪一項最可能是 over-service？", "供給端目前只有漁會的轉述，現場踏勘（已改期）時我們最該確認哪三件事？", "客群只鎖定台灣顧客，這個界定合理嗎？"], "vpc": {"P1": ["年節前，用不會出錯的方式送出重要客戶會滿意的禮", "選對整片或一口吃，並感受到對方的反應", "代表公司展現用心與體面"], "P2": ["在不是專家的情況下，買到來源清楚、品質穩定的烏魚子", "買之前就看得到實物或能試吃，不怕踩雷", "讓家人與長輩吃得開心"], "P3": ["把收到的烏魚子在年節吃得體面又不浪費", "需要送人時不會送錯口味", "用最簡單的方式料理（免料理或步驟簡單）"]}, "counts": {"PN": 15, "GN": 11, "IN": 12, "OP": 12, "P": 4, "ID": 18, "SV": 5, "HY": 6, "IV": 6}, "actors": [{"who": "顧客（P1 送禮者、P2 自用者、P3 收禮者）", "st": "已訪 5 位（I-01～I-05）", "need": [["買到來源清楚、品質穩定的，不怕踩雷", ["PN-01", "PN-02", "PN-03"]], ["送禮不出錯，也知道對方收到後的反應", ["PN-05", "PN-06"]]], "give": [["購買與年節訂單", ["I-01.O5", "I-03.O6"]], ["口碑推薦與收禮回饋", ["I-01.O7", "I-02", "I-03"]]]}, {"who": "新竹區漁會（推廣部）", "st": "已訪 1 位（I-06，2026-11-04）", "need": [["活動之外，平日也有持續的消費，不只烏魚節兩天", ["I-06.R2", "I-06.I9"]], ["讓外界知道新竹拔子窟烏魚子名列前茅", ["I-06.I2"]], ["需要更多民間力量、學校與企業一起串聯", ["I-06.R4"]]], "give": [["背書、既有的產銷履歷、水質藥檢與產地封條", ["I-06.O11"]], ["出面號召班長與合作餐廳、粉絲專頁轉發、烏魚節平台", ["I-06.D1", "I-06.D5", "I-06.O17"]], ["展架、履歷立牌與檢驗證書", ["I-06.D4"]]]}, {"who": "漁民（養殖戶，漁會轉述）", "st": "尚未直接訪談", "need": [["旺季有地方急速冷凍保存、穩定供應", ["I-06.O8", "I-06.O9", "I-06.I4"]], ["各戶各自包裝、定價與通路，難以統一品牌", ["I-06.O12"]], ["老一輩不想擺攤與做電商（待本人確認）", ["I-06.I6"]]], "give": [["品質堅持的烏魚子與熟客訂單", ["I-06.R1", "I-06.O13"]]]}, {"who": "青農（漁會轉述）", "st": "尚未訪談", "need": [["讓不會料理的年輕人與小家庭買得到、吃得到一口烏", ["I-06.O15", "I-06.I7"]]], "give": [["一口烏產品與智慧養殖經驗", ["I-06.O14", "I-06.O15"]]]}, {"who": "展售店／店家（含合作餐廳；同一業者兼營）", "st": "尚未訪談；改期中", "need": [["待補訪（自己的需求目前沒有資料）", []]], "give": [["便當量能約 100 個，漁會表示會請餐廳給專案優惠價（尚未報價）", ["I-06.D3"]]]}, {"who": "我們（Team4）", "st": "設計與驗證者", "need": [["把服務假說放到真實場域驗證，獲得學習機會，並完成課程要求、取得期中／期末成績（團隊自述）", ["HY-05"]]], "give": [["服務設計方法與五項服務提案", ["SV-01", "SV-02", "SV-03", "SV-04", "SV-05"]]]}], "actorsNote": "AI 草擬，待團隊確認。每項只取已有的訪談原話或項目編號；漁民、青農與餐廳的內容來自漁會轉述，尚未直接訪談，補訪後再修正。", "golden": [{"q": "I-02.I2", "pn": "PN-01"}, {"q": "I-03.I3", "pn": "PN-02"}, {"q": "I-05.O7", "pn": "PN-06"}, {"q": "I-01.I2", "pn": "PN-07"}, {"q": "I-04.D1", "pn": "PN-09"}]}, "vS": {"interviews": [{"id": "I-01", "name": "林福仁老師｜10/17 課堂（第 6 週）", "type": "tch", "role": "利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "date": "2026-10-17", "place": "清大 EMBA 課堂（逐字稿 P36、P37、P66–P68）", "sil": "I-04", "srole": "老師（逐字稿）", "src": "課堂逐字稿", "who": "利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "team": "", "O": "", "R": "", "I": "", "D": "", "see": "", "hear": "", "think": "", "pain": [], "gain": "看到邏輯完整、脈絡可追尋的報告。", "qs": {"O": [{"c": "I-01.O1", "t": "期中專題提案報告在 11 月 7 日，六組、每組約 20 分鐘；不用寫報告，只要把 PowerPoint 做好並報告。〔10/17 P36、P66〕"}, {"c": "I-01.O2", "t": "俊程老師會在 11 月 7 日到場了解各組進展；期末是專題成果報告，兩位老師會一起聆聽。〔10/17 P36〕"}, {"c": "I-01.O3", "t": "離期中報告還有兩次上課（含 10/17 這一次），老師說這一次「蠻 critical」。〔10/17 P36、P37〕"}, {"c": "I-01.O4", "t": "下週回到 321 室（服務設計房間），各組把目前的場域調查（Contextual Inquiry、Discovery）與已訪談的關係人帶進去，繼續後續流程。〔10/17 P36〕"}, {"c": "I-01.O5", "t": "報告要用有邏輯的方式呈現，例如 ORID：設計了幾份訪談題目（給創辦人、給顧客、給供應商各一份）。〔10/17 P66〕"}, {"c": "I-01.O6", "t": "接著要呈現同理心地圖，並說明怎麼從圖裡找到 Pain 與 Gain。〔10/17 P66〕"}, {"c": "I-01.O7", "t": "再把 Pain 與 Gain 放進 Customer Profile，導向 Value Proposition Canvas，想出哪些做法可以減輕痛點。〔10/17 P66〕"}, {"c": "I-01.O8", "t": "最後提出服務雛形，並評量是否 fit 到目標；成立的話再慢慢往下建構。〔10/17 P66〕"}, {"c": "I-01.O9", "t": "服務提供者也有同理心地圖與痛點、快樂點，可以做 provider 的 Profile；顧客的 Gain 搞不好就能降低提供者的 Pain。〔10/17 P67〕"}], "R": [{"c": "I-01.R1", "t": "老師強調這一次上課「蠻 critical」，因為離期中報告只剩兩次課。〔10/17 P37〕"}, {"c": "I-01.R2", "t": "老師希望各組在 11 月 7 日「至少把這個 model 稍微建構出來」，不是要求完成品。〔10/17 P68〕"}], "I": [{"c": "I-01.I1", "t": "結論必須有「可被追尋的脈絡」，讓人可以追尋、可以理解。〔10/17 P68〕"}, {"c": "I-01.I2", "t": "價值主張可以從提供者的分享浮現，也可以反過來檢查顧客是否認同，用來驗證。〔10/17 P67〕"}, {"c": "I-01.I3", "t": "服務系統裡不只有顧客，還有其他夥伴，看到的是更多面向的價值觀。〔10/17 P68〕"}], "D": [{"c": "I-01.D1", "t": "11 月 7 日的報告，至少要把 Customer Profile → VPC → 服務雛形 → fit 的模型建構出來，並附上前面的延伸過程。〔10/17 P68〕"}, {"c": "I-01.D2", "t": "初期先做顧客端的部分；提供者端與其他夥伴，碰得到再往下做也可以。〔10/17 P68〕"}]}, "em": {"say": [{"t": "報告用有邏輯的方式呈現：ORID → 同理心地圖 → Customer Profile → VPC → 服務雛形 → fit。", "src": ["I-01.O5", "I-01.O6", "I-01.O7", "I-01.O8"]}, {"t": "不用寫報告，只要把 PowerPoint 做好並報告，每組約 20 分鐘。", "src": ["I-01.O1"]}], "think": [{"t": "結論要有可被追尋的脈絡，讓人可以追尋與理解。", "src": ["I-01.I1"]}, {"t": "11 月 7 日至少把模型稍微建構出來，不要求完成品。", "src": ["I-01.R2", "I-01.D1"]}], "see": [{"t": "六組的進展；老師要從報告看出各組怎麼推導出結論。（歸納）", "src": ["I-01.O1", "I-01.O5"]}], "hear": [{"t": "俊程老師到場了解進展，期末兩位老師一起聆聽成果。", "src": ["I-01.O2"]}], "pain": [{"t": "離期中只剩兩次上課，時間緊迫（老師說「蠻 critical」）。（歸納）", "src": ["I-01.O3", "I-01.R1"]}], "gain": [{"t": "看到邏輯完整、脈絡可追尋的報告。（歸納）", "src": ["I-01.I1", "I-01.O5"]}]}, "say": "報告用有邏輯的方式呈現：ORID → 同理心地圖 → Customer Profile → VPC → 服務雛形 → fit。"}, {"id": "I-02", "name": "林福仁老師｜10/31 課堂（第 8 週）", "type": "tch", "role": "利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "date": "2026-10-31", "place": "清大 EMBA 課堂（逐字稿 P21–P25、P32–P36、P59–P60）", "sil": "I-04", "srole": "老師（逐字稿）", "src": "課堂逐字稿", "who": "利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "team": "", "O": "", "R": "", "I": "", "D": "", "see": "", "hear": "", "think": "", "pain": [], "gain": "用 ORID 把脈絡訪查材料呈現到同理心地圖，再往 Persona、VPC、fit 推進。", "qs": {"O": [{"c": "I-02.O1", "t": "11 月 7 日是期中報告，俊程老師與何彥倫老師都會出席。〔10/31 P21〕"}, {"c": "I-02.O2", "t": "期中的目的，是把服務主導邏輯、行動設計研究、服務設計等所學概念，與使用工具後的專題進展連結起來。〔10/31 P22〕"}, {"c": "I-02.O3", "t": "老師提醒：被打擾的組織把你的專題當作 homework 的話，基本上不會理你，所以一開始要花很多功夫去知道他要什麼。〔10/31 P24〕"}, {"c": "I-02.O4", "t": "各組現在的目標還沒出現，因為還沒深入場域了解痛點與想達成的目標；這一塊現在是問號。〔10/31 P25〕"}, {"c": "I-02.O5", "t": "當天要把脈絡訪查得到的材料，用 ORID 呈現到同理心地圖上。〔10/31 P59〕"}, {"c": "I-02.O6", "t": "流程：ORID（O 事實、R 感受、I 詮釋、D 決定）→ 找出 Pain 與 Gain → 人物誌與 JTBD → 價值主張畫布 → 適配檢視。〔10/31 P60〕"}, {"c": "I-02.O7", "t": "六組、每組四塊大白板，可以善用空間、便利貼與彩色筆，把專題的同理心地圖與初步構想做出來。〔10/31 P60〕"}, {"c": "I-02.O8", "t": "所有行動者都是資源整合者，也都希望在共同價值裡受益；專題要想清楚系統裡每個行動者的利益與需求。〔10/31 P32、P34〕"}], "R": [{"c": "I-02.R1", "t": "老師說目標現在是「問號」，要想辦法讓問號慢慢釐清，浮現出可以往下發展的方案。〔10/31 P25〕"}], "I": [{"c": "I-02.I1", "t": "價值由受益者認定，而且受益者不只顧客，也包含服務提供者；兩邊的認定可能完全不同，要想辦法對焦。〔10/31 P36〕"}, {"c": "I-02.I2", "t": "價值轉換時，如果顧客感受不到轉換的原因與替代的價值，顧客的感受就會減少。〔10/31 P56〕"}, {"c": "I-02.I3", "t": "進展報告時，要能充分連結課程提供的重要概念、工具與流程。〔10/31 P22〕"}], "D": [{"c": "I-02.D1", "t": "休息十分鐘後，分組動手把專題的同理心地圖與初步構想打造出來。〔10/31 P60〕"}, {"c": "I-02.D2", "t": "下週（11 月 7 日）各組進行期中報告。〔10/31 P60〕"}]}, "em": {"say": [{"t": "把專題進展與課程的概念、工具、流程連結起來。", "src": ["I-02.O2", "I-02.I3"]}], "think": [{"t": "目標還沒出現，是因為還沒深入場域了解痛點；現在是問號。", "src": ["I-02.O4", "I-02.R1"]}, {"t": "價值由受益者認定，顧客與提供者的認定可能不同。", "src": ["I-02.I1"]}], "see": [{"t": "六組、每組四塊白板，用便利貼與彩色筆做同理心地圖。", "src": ["I-02.O7"]}], "hear": [{"t": "期中由俊程老師與何彥倫老師一起出席。", "src": ["I-02.O1"]}], "pain": [{"t": "把專題當 homework 的話，被打擾的組織不會理你。（歸納）", "src": ["I-02.O3"]}], "gain": [{"t": "用 ORID 把脈絡訪查材料呈現到同理心地圖，再往 Persona、VPC、fit 推進。（歸納）", "src": ["I-02.O5", "I-02.O6"]}]}, "say": "把專題進展與課程的概念、工具、流程連結起來。"}, {"id": "I-11", "name": "組員A｜Team4A 組員", "type": "team", "role": "Team4A 組員（ORID 訪談）", "date": "", "place": "ORID 訪談", "sil": "I-03", "srole": "Team4A 組員", "src": "組員 ORID 訪談", "who": "Team4A 組員（ORID 訪談）", "team": "", "O": "", "R": "", "I": "", "D": "", "see": "", "hear": "", "think": "", "pain": [], "gain": "一打開就知道上次決定什麼、我接哪一件；補完一段能存起來，下一個人看得到；十五分鐘可以，但不要複雜操作。", "qs": {"O": [{"c": "I-11.O1", "t": "上次就是週六上課的空檔，幾個人在教室先講一下。早上九點到下午四點都排課，四點後又有人要去另一堂，講到分工就得散了。"}, {"c": "I-11.O3", "t": "我大概是晚上忙完才看一下，一次十幾分鐘。有時候有空，可是不知道現在輪到我補哪一塊，翻完訊息時間也差不多了。"}], "R": [{"c": "I-11.R2", "t": "最累的是喬線上時間。這個人可以，那個人不行，好不容易約成，前面又要先把沒跟到的人補一遍。"}, {"c": "I-11.R3", "t": "會有點不好意思，好像都是我沒跟上。但我其實有看訊息，只是不確定哪一句是最後決定，就又不敢直接改。"}], "I": [{"c": "I-11.I1", "t": "少的不是每個人的工時，是大家可以一起決定事情的那一段。能自己做的應該先做完，碰面才有時間討論真的有分歧的地方。"}, {"c": "I-11.I3", "t": "至少下次再問同一件事，大家講的是同一個決定，而且知道誰接下去。當下沒反對，我覺得還不算真的有共識。"}], "D": [{"c": "I-11.D1", "t": "現在就是請有跟到的人幫忙整理重點，再私訊問我能做什麼。有用啦，但每次都要麻煩同一個人。"}, {"c": "I-11.D2", "t": "先讓我一打開就知道，上次決定了什麼、我接哪一件。不要先叫我從一大串聊天裡自己找。"}, {"c": "I-11.D3", "t": "有個網頁能把最新結論和待辦放在一起就很好。我補完一段能存起來，下一個人看得到，不用等全員一起上線。"}, {"c": "I-11.D4", "t": "十五分鐘可以啊，前提是不用先學一套很複雜的操作。我只想補一筆資料，不想每次都填一整張表。"}]}, "em": {"say": [{"t": "請有跟到的人幫忙整理重點，再私訊問我能做什麼；有用，但每次都麻煩同一個人。", "src": ["I-11.D1"]}], "think": [{"t": "少的是大家可以一起決定事情的那一段；能自己做的先做完。共識是下次再問，大家講同一個決定且知道誰接下去。", "src": ["I-11.I1", "I-11.I3"]}], "see": [{"t": "週六課堂空檔講到分工就得散；晚上只剩十幾分鐘，不知道現在輪到補哪一塊。", "src": ["I-11.O1", "I-11.O3"]}], "pain": [{"t": "喬線上時間，約成了還要把沒跟到的人補一遍；不確定哪一句是最後決定，不敢直接改。", "src": ["I-11.R2", "I-11.R3"]}], "gain": [{"t": "一打開就知道上次決定什麼、我接哪一件；補完一段能存起來，下一個人看得到；十五分鐘可以，但不要複雜操作。", "src": ["I-11.D2", "I-11.D3", "I-11.D4"]}]}, "say": "請有跟到的人幫忙整理重點，再私訊問我能做什麼；有用，但每次都麻煩同一個人。"}, {"id": "I-12", "name": "組員B｜Team4A 組員", "type": "team", "role": "Team4A 組員（ORID 訪談）", "date": "", "place": "ORID 訪談", "sil": "I-05", "srole": "Team4A 組員", "src": "組員 ORID 訪談", "who": "Team4A 組員（ORID 訪談）", "team": "", "O": "", "R": "", "I": "", "D": "", "see": "", "hear": "", "think": "", "pain": [], "gain": "大家看著同一張白板才發現客戶不是同一種人；要有大家都認的最新版；原始資料與整理後的圖放一起，有紀錄、可退回，共識仍由我們自己談。", "qs": {"O": [{"c": "I-12.O2", "t": "白板拍照在手機，討論在LINE，分工又有一份Excel。上次找旅程圖，我先翻群組，再問誰存了新版，找到後還不敢確定是不是最後那張。"}, {"c": "I-12.O5", "t": "我會先把大家講的重點貼到Excel，再改成短句。有時候改得比較順，就忘了把原本是哪一張便利貼一起留下來。"}], "R": [{"c": "I-12.R1", "t": "有一次大家看著同一張白板，才發現我們講的客戶根本不是同一種人。把對象講清楚之後，後面就順很多，那次真的有一起想事情的感覺。"}, {"c": "I-12.R2", "t": "最煩的是整理好了，才有人說他手上還有另一版。我又得一格一格比，怕把別人補的東西蓋掉。"}], "I": [{"c": "I-12.I3", "t": "我希望結論寫出來，大家能補一句同意或哪裡有疑問。群組按個讚，有時候只是代表看到了，不能直接當成同意。"}, {"c": "I-12.I4", "t": "同理心圖做完要轉旅程圖時最容易卡。原來那些便利貼到底搬哪些過去，哪些是我們自己解讀的，常常又重講一次。"}], "D": [{"c": "I-12.D1", "t": "我現在會把檔名加日期，整理一段結論貼群組。當天還找得到，過幾天訊息多了又沉下去。"}, {"c": "I-12.D2", "t": "先有一個大家都認的最新版。白板照片、結論、還沒決定的事放一起，別每次都要我再做一次總整理。"}, {"c": "I-12.D3", "t": "我希望一個地方就能看到原始資料和整理後的圖，改了有紀錄，也能退回上一版。共識還是要我們自己談，系統別直接幫我們判定大家同意了。"}]}, "em": {"say": [{"t": "檔名加日期、整理一段結論貼群組；當天找得到，過幾天又沉下去。", "src": ["I-12.D1"]}], "think": [{"t": "結論寫出來，大家補一句同意或疑問；同理心圖轉旅程圖時最容易卡。", "src": ["I-12.I3", "I-12.I4"]}], "see": [{"t": "白板照片在手機、討論在 LINE、分工在 Excel；改短句時忘了把原本的便利貼一起留下。", "src": ["I-12.O2", "I-12.O5"]}], "pain": [{"t": "整理好了才有人說手上還有另一版，怕把別人補的蓋掉。", "src": ["I-12.R2"]}], "gain": [{"t": "大家看著同一張白板才發現客戶不是同一種人；要有大家都認的最新版；原始資料與整理後的圖放一起，有紀錄、可退回，共識仍由我們自己談。", "src": ["I-12.R1", "I-12.D2", "I-12.D3"]}]}, "say": "檔名加日期、整理一段結論貼群組；當天找得到，過幾天又沉下去。"}, {"id": "I-13", "name": "組員C｜Team4A 組員", "type": "team", "role": "Team4A 組員（ORID 訪談）", "date": "", "place": "ORID 訪談", "sil": "I-06", "srole": "Team4A 組員", "src": "組員 ORID 訪談", "who": "Team4A 組員（ORID 訪談）", "team": "", "O": "", "R": "", "I": "", "D": "", "see": "", "hear": "", "think": "", "pain": [], "gain": "時間、訪談對象、負責人和缺的題目放同一處；一打開就看到哪個訪談改期、哪些資料還缺。", "qs": {"O": [{"c": "I-13.O1", "t": "我們上次是先在群組分配誰聯絡誰，再各自回覆。我這邊時間確定了，別人的還沒確定，後來才發現大家以為約的是不同天。"}, {"c": "I-13.O4", "t": "本來想趁連假去訪談，碰上颱風只好取消。後來重約，對方又臨時有事改時間。我在群組改了安排，但有人還是照舊的分工在準備。"}], "R": [{"c": "I-13.R2", "t": "重約其實還好，最怕的是我改了時間，卻漏通知一個人。人家也是特地空下來的，我會覺得很抱歉。"}, {"c": "I-13.R3", "t": "會急，因為不是我多做一點就能補回來。沒有訪到的資料，後面又等著要用，我也不想為了趕進度就自己猜。"}], "I": [{"c": "I-13.I1", "t": "訪談還要配合對方，跟我們幾個約開會又不一樣。能先把題目、分工準備好，時間一確定才接得上，不然又浪費一次機會。"}, {"c": "I-13.I2", "t": "有問到和還沒問到要分清楚。訪談取消就是真的沒資料，不能把我們原來的想法寫得像對方已經講過。"}], "D": [{"c": "I-13.D1", "t": "我先在群組重新確認時間，再請大家回覆收到；還沒訪到的先標待補，能整理的資料先整理。就是得一直追大家有沒有看到。"}, {"c": "I-13.D2", "t": "先把時間、訪談對象、誰負責和待補的題目放在同一個地方，變動一次大家都看同一份。"}, {"c": "I-13.D3", "t": "我想一打開就看到哪個訪談改期、哪些資料還缺。它當然不能幫我控制颱風，但至少不用每改一次就把前面全部重講。"}]}, "em": {"say": [{"t": "先在群組重新確認時間，請大家回覆收到；沒訪到的先做標記，能整理的先整理；得一直追大家有沒有看到。", "src": ["I-13.D1"]}], "think": [{"t": "訪談要配合對方，與約組員開會不同；有問到和還沒問到要分清楚，不能把我們的想法寫得像對方講過。", "src": ["I-13.I1", "I-13.I2"]}], "see": [{"t": "大家以為約的是不同天；颱風取消、重約後對方改時間，有人還是照舊的分工在準備。", "src": ["I-13.O1", "I-13.O4"]}], "pain": [{"t": "改了時間卻漏通知一個人，很抱歉；沒訪到的資料後面要用，不想自己猜。", "src": ["I-13.R2", "I-13.R3"]}], "gain": [{"t": "時間、訪談對象、負責人和缺的題目放同一處；一打開就看到哪個訪談改期、哪些資料還缺。", "src": ["I-13.D2", "I-13.D3"]}]}, "say": "先在群組重新確認時間，請大家回覆收到；沒訪到的先做標記，能整理的先整理；得一直追大家有沒有看到。"}, {"id": "I-14", "name": "組員D｜Team4A 組員", "type": "team", "role": "Team4A 組員（ORID 訪談）", "date": "", "place": "ORID 訪談", "sil": "I-07", "srole": "Team4A 組員", "src": "組員 ORID 訪談", "who": "Team4A 組員（ORID 訪談）", "team": "", "O": "", "R": "", "I": "", "D": "", "see": "", "hear": "", "think": "", "pain": [], "gain": "能把原話翻出來，大家馬上知道在講哪個情境；引用關係跟著資料走；點痛點回看原話再看連到的方案，輸出報告帶編號；沒有來源先記成假設、不要整個鎖住，但當正式結論輸出時要提醒缺哪個依據。", "qs": {"O": [{"c": "I-14.O2", "t": "我整理報告時會同時開訪談紀錄、照片和簡報。常常簡報那句話寫得很完整，可是要回去找誰講的，就得一份一份翻。"}, {"c": "I-14.O5", "t": "我先挑一句原話，旁邊寫我理解的痛點，再放進分類。問題是貼到簡報時只留下短句，受訪者和題號沒一起帶過去，之後要自己補找。"}], "R": [{"c": "I-14.R1", "t": "有一次組員問這個痛點怎麼來的，我剛好能把原話翻出來，大家馬上就知道在講哪個情境。那種感覺很踏實，不是誰講得大聲就算。"}, {"c": "I-14.R3", "t": "最怕老師問這個結論根據什麼，我只記得好像有人說過。那時會很心虛，明明前面有做事，卻拿不出來。"}], "I": [{"c": "I-14.I2", "t": "對我來說，就是別人從結論往回看，找得到原話，也看得懂中間怎麼歸納。最難的是每搬一次資料，這條關係就少一截。"}, {"c": "I-14.I4", "t": "從痛點跳到價值主張那裡很容易斷。方案看起來都不錯，可是到底解哪個人的哪個問題，整理簡報時才又回頭對。"}], "D": [{"c": "I-14.D1", "t": "我現在用編號，自己在旁邊記對應哪段訪談。資料一多就會漏，修了前面的內容，後面也不一定記得改。"}, {"c": "I-14.D2", "t": "先讓引用關係跟著資料走。不要到報告前一晚，才發現每個結論都要重新找出處。"}, {"c": "I-14.D3", "t": "我想點一下痛點就能回去看原話，再看到它連到哪個方案。輸出期中報告時也把這些編號帶上，這樣我才敢直接拿去用。"}, {"c": "I-14.D5", "t": "沒有來源還是可以先記成假設，不要整個鎖住。但如果要把它當成正式結論輸出，就要清楚提醒我還缺哪個依據。"}]}, "em": {"say": [{"t": "用編號記對應哪一段訪談；資料一多就會漏，修了前面不一定記得改後面。", "src": ["I-14.D1"]}], "think": [{"t": "脈絡就是別人從結論往回看找得到原話、看得懂歸納；從痛點跳到價值主張最容易斷。", "src": ["I-14.I2", "I-14.I4"]}], "see": [{"t": "同時開訪談紀錄、照片和簡報；貼到簡報只留短句，受訪者與題號沒有一起帶過去。", "src": ["I-14.O2", "I-14.O5"]}], "pain": [{"t": "怕老師問結論根據什麼，只記得好像有人說過，很心虛。", "src": ["I-14.R3"]}], "gain": [{"t": "能把原話翻出來，大家馬上知道在講哪個情境；引用關係跟著資料走；點痛點回看原話再看連到的方案，輸出報告帶編號；沒有來源先記成假設、不要整個鎖住，但當正式結論輸出時要提醒缺哪個依據。", "src": ["I-14.R1", "I-14.D2", "I-14.D3", "I-14.D5"]}]}, "say": "用編號記對應哪一段訪談；資料一多就會漏，修了前面不一定記得改後面。"}, {"id": "I-15", "name": "組員E｜Team4A 組員", "type": "team", "role": "Team4A 組員（ORID 訪談）", "date": "", "place": "ORID 訪談", "sil": "I-08", "srole": "Team4A 組員", "src": "組員 ORID 訪談", "who": "Team4A 組員（ORID 訪談）", "team": "", "O": "", "R": "", "I": "", "D": "", "see": "", "hear": "", "think": "", "pain": [], "gain": "告訴我這一步要準備什麼、留下什麼才算完成；App 把講義方法、範本與已填資料接在一起，告訴我缺哪一項並可點回講義；每完成一小段就能存；漏了關鍵資料提醒、草稿先讓我留，一般順序提醒就好。", "qs": {"O": [{"c": "I-15.O3", "t": "我通常下班後開講義看一下。時間不多，光找現在這一步在講義哪一頁就花掉一段，後來就先做自己比較熟的部分。"}, {"c": "I-15.O6", "t": "上次我們先把方案想好了，回來畫旅程圖才發現，根本沒問清楚對方在哪個環節最困擾。只好回頭補問題，已經寫好的方案也得先放著。"}], "R": [{"c": "I-15.R4", "t": "會有點洩氣，想說前面那麼認真是不是白做了。我不太想說誰漏掉，就跟大家說，我們先看缺哪一段，補上再往下走。"}], "I": [{"c": "I-15.I4", "t": "每個工具單看都懂，串起來就沒那麼確定。ORID做完怎麼到同理心圖，再到痛點，哪些能沿用、哪些還要問，我常常搞不清楚。"}, {"c": "I-15.I5", "t": "我比較常是不知道做到哪裡算夠。表格有填就以為可以往下走，結果下一步要用的資料根本沒收到；有時又一直補，卡在同一張圖。"}], "D": [{"c": "I-15.D1", "t": "現在會回去翻講義，或問比較熟的組員。問得到當然快，可是對方也忙，不可能每一步都陪我檢查。"}, {"c": "I-15.D2", "t": "先告訴我這一步要準備什麼、留下什麼才算完成。這個清楚，我就比較敢自己往下做。"}, {"c": "I-15.D3", "t": "如果有個App，把講義的方法、範本和我們已經填的資料接在一起，我會想用。最好直接告訴我現在缺哪一項，還能點回講義那一頁，不用重找。"}, {"c": "I-15.D4", "t": "會，但我希望每次能完成一小段就存起來。如果只是把PDF搬上去，還是要我到處複製貼上，那就沒省到時間。"}, {"c": "I-15.D5", "t": "漏了關鍵資料就提醒我為什麼不能算完成，草稿先讓我留。一般順序可以提醒就好，不要連回頭改前面都擋住，不然我可能又改回用Excel。"}]}, "em": {"say": [{"t": "回去翻講義或問比較熟的組員；問得到很快，但對方也忙。", "src": ["I-15.D1"]}], "think": [{"t": "每個工具單看都懂，串起來就不確定；比較常是不知道做到哪裡算夠。", "src": ["I-15.I4", "I-15.I5"]}], "see": [{"t": "下班後開講義，光找這一步在哪一頁就花掉一段；先把方案想好，畫旅程圖才發現沒問清楚對方哪個環節最困擾。", "src": ["I-15.O3", "I-15.O6"]}], "pain": [{"t": "回頭補漏時會洩氣，想說前面是不是白做了。", "src": ["I-15.R4"]}], "gain": [{"t": "告訴我這一步要準備什麼、留下什麼才算完成；App 把講義方法、範本與已填資料接在一起，告訴我缺哪一項並可點回講義；每完成一小段就能存；漏了關鍵資料提醒、草稿先讓我留，一般順序提醒就好。", "src": ["I-15.D2", "I-15.D3", "I-15.D4", "I-15.D5"]}]}, "say": "回去翻講義或問比較熟的組員；問得到很快，但對方也忙。"}], "reg": [{"c": "I-01", "y": "I", "t": "林福仁老師｜10/17 課堂（第 6 週）｜利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "d": "利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "ev": [], "ln": [], "home": "discover"}, {"c": "I-02", "y": "I", "t": "林福仁老師｜10/31 課堂（第 8 週）｜利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "d": "利害關係人：期中報告的出題與檢視者（以課堂逐字稿為來源，不是訪談）", "ev": [], "ln": [], "home": "di 的時間、最新版、來源跟著資料走、這一步要留下什麼", "一打開知道輪到我做什麼；結論與最新版放同處；點得回原話；缺什麼會提醒", "早到晚都排課；颱風與改期；資料分散在手機、LINE、Excel", "請同一位組員整理、檔名加日期、用編號記來源、翻講義或問人", "接力與留存、證據可追溯、步驟講清楚、缺關鍵資料時提醒"]}], "insight": "三份材料指向同一件事：能一起決定的時間很少，而老師要的是看得見的脈絡；組員要的是一打開就知道輪到什麼、要留下什麼，結論與來源放在同一處，缺關鍵資料時被提醒，但共識與內容仍由自己決定。"}, "notes": [{"t": "上次就是週六上課的空檔，幾個人在教室先講一下。早上九點到下午四點都排課，四點後又有人要去另一堂，講到分工就得散了。", "id": "I-11", "k": "time", "q": "I-11.O1", "pn": "PN-01"}, {"t": "少的不是每個人的工時，是大家可以一起決定事情的那一段。能自己做的應該先做完，碰面才有時間討論真的有分歧的地方。", "id": "I-11", "k": "time", "q": "I-11.I1", "pn": "PN-01"}, {"t": "訪談還要配合對方，跟我們幾個約開會又不一樣。能先把題目、分工準備好，時間一確定才接得上，不然又浪費一次機會。", "id": "I-13", "k": "time", "q": "I-13.I1", "pn": "PN-01"}, {"t": "離期中報告還有兩次上課（含 10/17 這一次），老師說這一次「蠻 critical」。〔10/17 P36、P37〕", "id": "I-01", "k": "time", "q": "I-01.O3", "pn": "PN-01"}, {"t": "我大概是晚上忙完才看一下，一次十幾分鐘。有時候有空，可是不知道現在輪到我補哪一塊，翻完訊息時間也差不多了。", "id": "I-11", "k": "time", "q": "I-11.O3", "pn": "PN-02"}, {"t": "我通常下班後開講義看一下。時間不多，光找現在這一步在講義哪一頁就花掉一段，後來就先做自己比較熟的部分。", "id": "I-15", "k": "time", "q": "I-15.O3", "pn": "PN-02"}, {"t": "十五分鐘可以啊，前提是不用先學一套很複雜的操作。我只想補一筆資料，不想每次都填一整張表。", "id": "I-11", "k": "time", "q": "I-11.D4", "pn": "PN-02"}, {"t": "現在就是請有跟到的人幫忙整理重點，再私訊問我能做什麼。有用啦，但每次都要麻煩同一個人。", "id": "I-11", "k": "time", "q": "I-11.D1", "pn": "PN-02"}, {"t": "最累的是喬線上時間。這個人可以，那個人不行，好不容易約成，前面又要先把沒跟到的人補一遍。", "id": "I-11", "k": "time", "q": "I-11.R2", "pn": "PN-03"}, {"t": "上次就是週六上課的空檔，幾個人在教室先講一下。早上九點到下午四點都排課，四點後又有人要去另一堂，講到分工就得散了。", "id": "I-11", "k": "time", "q": "I-11.O1", "pn": "PN-03"}, {"t": "我們上次是先在群組分配誰聯絡誰，再各自回覆。我這邊時間確定了，別人的還沒確定，後來才發現大家以為約的是不同天。", "id": "I-13", "k": "time", "q": "I-13.O1", "pn": "PN-03"}, {"t": "至少下次再問同一件事，大家講的是同一個決定，而且知道誰接下去。當下沒反對，我覺得還不算真的有共識。", "id": "I-11", "k": "co", "q": "I-11.I3", "pn": "PN-04"}, {"t": "我希望結論寫出來，大家能補一句同意或哪裡有疑問。群組按個讚，有時候只是代表看到了，不能直接當成同意。", "id": "I-12", "k": "co", "q": "I-12.I3", "pn": "PN-04"}, {"t": "會有點不好意思，好像都是我沒跟上。但我其實有看訊息，只是不確定哪一句是最後決定，就又不敢直接改。", "id": "I-11", "k": "co", "q": "I-11.R3", "pn": "PN-04"}, {"t": "有一次大家看著同一張白板，才發現我們講的客戶根本不是同一種人。把對象講清楚之後，後面就順很多，那次真的有一起想事情的感覺。", "id": "I-12", "k": "co", "q": "I-12.R1", "pn": "PN-04"}, {"t": "白板拍照在手機，討論在LINE，分工又有一份Excel。上次找旅程圖，我先翻群組，再問誰存了新版，找到後還不敢確定是不是最後那張。", "id": "I-12", "k": "info", "q": "I-12.O2", "pn": "PN-05"}, {"t": "最煩的是整理好了，才有人說他手上還有另一版。我又得一格一格比，怕把別人補的東西蓋掉。", "id": "I-12", "k": "info", "q": "I-12.R2", "pn": "PN-05"}, {"t": "會有點不好意思，好像都是我沒跟上。但我其實有看訊息，只是不確定哪一句是最後決定，就又不敢直接改。", "id": "I-11", "k": "info", "q": "I-11.R3", "pn": "PN-05"}, {"t": "我整理報告時會同時開訪談紀錄、照片和簡報。常常簡報那句話寫得很完整，可是要回去找誰講的，就得一份一份翻。", "id": "I-14", "k": "info", "q": "I-14.O2", "pn": "PN-05"}, {"t": "我們上次是先在群組分配誰聯絡誰，再各自回覆。我這邊時間確定了，別人的還沒確定，後來才發現大家以為約的是不同天。", "id": "I-13", "k": "info", "q": "I-13.O1", "pn": "PN-05"}, {"t": "本來想趁連假去訪談，碰上颱風只好取消。後來重約，對方又臨時有事改時間。我在群組改了安排，但有人還是照舊的分工在準備。", "id": "I-13", "k": "field", "q": "I-13.O4", "pn": "PN-06"}, {"t": "會急，因為不是我多做一點就能補回來。沒有訪到的資料，後面又等著要用，我也不想為了趕進度就自己猜。", "id": "I-13", "k": "field", "q": "I-13.R3", "pn": "PN-06"}, {"t": "本來想趁連假去訪談，碰上颱風只好取消。後來重約，對方又臨時有事改時間。我在群組改了安排，但有人還是照舊的分工在準備。", "id": "I-13", "k": "field", "q": "I-13.O4", "pn": "PN-07"}, {"t": "重約其實還好，最怕的是我改了時間，卻漏通知一個人。人家也是特地空下來的，我會覺得很抱歉。", "id": "I-13", "k": "field", "q": "I-13.R2", "pn": "PN-07"}, {"t": "訪談還要配合對方，跟我們幾個約開會又不一樣。能先把題目、分工準備好，時間一確定才接得上，不然又浪費一次機會。", "id": "I-13", "k": "field", "q": "I-13.I1", "pn": "PN-07"}, {"t": "期中專題提案報告在 11 月 7 日，六組、每組約 20 分鐘；不用寫報告，只要把 PowerPoint 做好並報告。〔10/17 P36、P66〕", "id": "I-01", "k": "req", "q": "I-01.O1", "pn": "PN-08"}, {"t": "離期中報告還有兩次上課（含 10/17 這一次），老師說這一次「蠻 critical」。〔10/17 P36、P37〕", "id": "I-01", "k": "req", "q": "I-01.O3", "pn": "PN-08"}, {"t": "報告要用有邏輯的方式呈現，例如 ORID：設計了幾份訪談題目（給創辦人、給顧客、給供應商各一份）。〔10/17 P66〕", "id": "I-01", "k": "req", "q": "I-01.O5", "pn": "PN-08"}, {"t": "老師強調這一次上課「蠻 critical」，因為離期中報告只剩兩次課。〔10/17 P37〕", "id": "I-01", "k": "req", "q": "I-01.R1", "pn": "PN-08"}, {"t": "最怕老師問這個結論根據什麼，我只記得好像有人說過。那時會很心虛，明明前面有做事，卻拿不出來。", "id": "I-14", "k": "req", "q": "I-14.R3", "pn": "PN-08"}, {"t": "我通常下班後開講義看一下。時間不多，光找現在這一步在講義哪一頁就花掉一段，後來就先做自己比較熟的部分。", "id": "I-15", "k": "start", "q": "I-15.O3", "pn": "PN-09"}, {"t": "我大概是晚上忙完才看一下，一次十幾分鐘。有時候有空，可是不知道現在輪到我補哪一塊，翻完訊息時間也差不多了。", "id": "I-11", "k": "start", "q": "I-11.O3", "pn": "PN-09"}, {"t": "現在會回去翻講義，或問比較熟的組員。問得到當然快，可是對方也忙，不可能每一步都陪我檢查。", "id": "I-15", "k": "start", "q": "I-15.D1", "pn": "PN-09"}, {"t": "我比較常是不知道做到哪裡算夠。表格有填就以為可以往下走，結果下一步要用的資料根本沒收到；有時又一直補，卡在同一張圖。", "id": "I-15", "k": "start", "q": "I-15.I5", "pn": "PN-10"}, {"t": "先告訴我這一步要準備什麼、留下什麼才算完成。這個清楚，我就比較敢自己往下做。", "id": "I-15", "k": "start", "q": "I-15.D2", "pn": "PN-10"}, {"t": "上次我們先把方案想好了，回來畫旅程圖才發現，根本沒問清楚對方在哪個環節最困擾。只好回頭補問題，已經寫好的方案也得先放著。", "id": "I-15", "k": "start", "q": "I-15.O6", "pn": "PN-10"}, {"t": "我比較常是不知道做到哪裡算夠。表格有填就以為可以往下走，結果下一步要用的資料根本沒收到；有時又一直補，卡在同一張圖。", "id": "I-15", "k": "done", "q": "I-15.I5", "pn": "PN-11"}, {"t": "先告訴我這一步要準備什麼、留下什麼才算完成。這個清楚，我就比較敢自己往下做。", "id": "I-15", "k": "done", "q": "I-15.D2", "pn": "PN-11"}, {"t": "上次我們先把方案想好了，回來畫旅程圖才發現，根本沒問清楚對方在哪個環節最困擾。只好回頭補問題，已經寫好的方案也得先放著。", "id": "I-15", "k": "done", "q": "I-15.O6", "pn": "PN-12"}, {"t": "會有點洩氣，想說前面那麼認真是不是白做了。我不太想說誰漏掉，就跟大家說，我們先看缺哪一段，補上再往下走。", "id": "I-15", "k": "done", "q": "I-15.R4", "pn": "PN-12"}, {"t": "我比較常是不知道做到哪裡算夠。表格有填就以為可以往下走，結果下一步要用的資料根本沒收到；有時又一直補，卡在同一張圖。", "id": "I-15", "k": "done", "q": "I-15.I5", "pn": "PN-12"}, {"t": "上次我們先把方案想好了，回來畫旅程圖才發現，根本沒問清楚對方在哪個環節最困擾。只好回頭補問題，已經寫好的方案也得先放著。", "id": "I-15", "k": "order", "q": "I-15.O6", "pn": "PN-13"}, {"t": "會有點洩氣，想說前面那麼認真是不是白做了。我不太想說誰漏掉，就跟大家說，我們先看缺哪一段，補上再往下走。", "id": "I-15", "k": "order", "q": "I-15.R4", "pn": "PN-13"}], "ideas": [{"c": "ID-01", "t": "非同步接力卡：每位組員留下「我做到哪、下一步誰接」", "v": 1, "fin": "SV-01", "ln": ["OP-01", "OP-02"], "wild": false}, {"c": "ID-02", "t": "15 分鐘小任務清單：依目前階段列出可以單獨完成的小步驟，完成一小段就能存", "v": 2, "fin": "SV-01", "ln": ["OP-01"], "wild": false}, {"c": "ID-03", "t": "每次討論的結論一鍵存入證據庫並標記版本，讓大家認同同一個最新版", "v": 2, "fin": "SV-02", "ln": ["OP-02"], "wild": false}, {"c": "ID-04", "t": "編碼證據鏈：原話 → 痛點 → 洞察 → 機會點 → 構想 → 服務 → 假說，都能點回上游", "v": 1, "fin": "SV-03", "ln": ["OP-03"], "wild": false <script>
/* ===== 團隊頁（兩個 App 共用）：teamHTML(T,{up}) =====
   T={members:[{code,name,en,role,pair,knowledge,experience,goal,interests}],caps:[...],skills:{code:{cap:'3'|'培養'}},info:[{code,topic,content}],photos:{code:dataURL}} */
const TM_E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
var TM_SIL=window.TM_SIL='<svg viewBox="0 0 64 64" fill="currentColor"><circle cx="32" cy="22" r="11"/><path d="M10 60c0-13 9-22 22-22s22 9 22 22z"/></svg>';
const tmScore=v=>{v=String(v==null?'':v).trim();if(v==='')return null;if(v==='培養')return 0;const n=parseInt(v,10);return isNaN(n)?null:Math.max(0,Math.min(5,n))};
const tmPill=v=>{const n=tmScore(v);return n===null?'<span class="pn">—</span>':n===0?'<span class="p p0">培養</span>':`<span class="p p${n}">${n}</span>`};
function tmCoverage(T){return T.caps.map(cap=>{const rows=T.members.map(m=>({m,v:tmScore((T.skills[m.code]||{})[cap])}));const vs=rows.filter(r=>r.v!==null);const max=vs.length?Math.max(...vs.map(r=>r.v)):0;
 const strong=vs.filter(r=>r.v>=4),leads=max>0?vs.filter(r=>r.v===max):[],grow=vs.filter(r=>r.v===0).length,mid=vs.filter(r=>r.v>=3).length;
 const st=strong.length>=2?['ok','穩健']:strong.length===1?['sp','單點依賴']:max>=3?['sp','無高分成員']:['gap','缺口'];
 return{cap,rows,max,strong,leads,grow,mid,st}})}
function teamHTML(T,o){o=o||{};const ms=T.members;
 if(!ms.length)return'<div class="empty"><div>還沒有團隊資料。</div></div>';
 const cov=tmCoverage(T);const sp=cov.filter(c=>c.st[1]==='單點依賴').length,ok=cov.filter(c=>c.st[1]==='穩健').length,gap=cov.filter(c=>c.st[0]==='gap'||c.st[1]==='無高分成員').length;
 const info=(T.info||[]).length?`<div class="sub">團隊簡介</div><div class="tm-info">${T.info.map(i=>`<div class="ti"><b>${TM_E(i.topic)}</b><span>${TM_E(i.content)}</span></div>`).join('')}</div>`:'';
 const card=m=>{const img=(T.photos||{})[m.code];const sk=T.skills[m.code]||{};const top=T.caps.map(c=>[c,tmScore(sk[c])]).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]);
  return`<article class="mc"><div class="mh"><div><div class="mav">${img?`<img src="${img}" alt="${TM_E(m.name)}">`:(o.base!=null?`<img src="${TM_E(o.base)}photos/${TM_E(m.code)}.jpg" alt="${TM_E(m.name)}" onerror="this.outerHTML=window.TM_SIL">`:TM_SIL)}</div>${o.up?`<label class="tm-up" data-noexp><input type="file" accept="image/*" data-tup="${TM_E(m.code)}">${img?'更換照片':'上傳照片'}</label>`:''}</div>
  <div style="min-width:0"><h3>${TM_E(m.name)}<small>${TM_E(m.en)}</small></h3>${m.role?`<span class="rl">${TM_E(m.role)}</span>`:''}<div class="xs mu" style="margin-top:4px"><span class="mid" style="margin:0">${TM_E(m.code)}</span></div></div></div>
  <div class="mg"><div class="mb k"><b>知識</b>${TM_E(m.knowledge)}</div><div class="mb x"><b>經驗</b>${TM_E(m.experience)}</div><div class="mb g"><b>目標</b>${TM_E(m.goal)}</div><div class="mb i"><b>能力／興趣</b>${TM_E(m.interests)}</div></div>
  ${top.length?`<div class="str">強項：${top.map(([c,v])=>`<i class="${v===5?'l5':''}">${TM_E(c.replace(/力$/,''))} ${v}</i>`).join('')}</div>`:''}</article>`};
 const hm=`<div class="sub">團隊能力矩陣</div><div class="card"><div class="hm-wrap"><table class="hm"><thead><tr><th class="rn">成員</th>${T.caps.map(c=>`<th>${TM_E(c)}</th>`).join('')}</tr></thead><tbody>${ms.map(m=>`<tr><th class="rn">${TM_E(m.name)} ${TM_E(m.en)}</th>${T.caps.map(c=>`<td>${tmPill((T.skills[m.code]||{})[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="lg"><span>圖例</span><span class="p p5 hmx" style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc5);color:var(--sc5t)">5</span>精通<span style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc4);color:var(--sc4t)">4</span>熟練<span style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc3);color:var(--sc3t)">3</span>勝任<span style="display:inline-block;min-width:26px;text-align:center;border-radius:8px;background:var(--sc2);color:var(--sc2t)">2</span>基礎<span style="display:inline-block;min-width:36px;text-align:center;border-radius:8px;background:var(--sc0);color:var(--sc0t)">培養</span>待培養</div></div>`;
 const spN=cov.filter(c=>c.st[1]==='單點依賴').map(c=>`${c.cap}（僅 ${c.leads.map(r=>r.m.en||r.m.name).join('、')}）`),gapN=cov.filter(c=>c.st[0]==='gap'||c.st[1]==='無高分成員').map(c=>c.cap);
 const cv=`<div class="sub">能力覆蓋摘要</div><div class="cvn">${cov.length} 項能力中，<b>${ok}</b> 項有 2 位以上高分（≥4）成員，<b>${sp}</b> 項為單點依賴（只有 1 位高分），<b>${gap}</b> 項缺高分成員。${spN.length?`<br>單點依賴：${spN.map(TM_E).join('；')}。`:''}${gapN.length?`<br>缺口：${gapN.map(TM_E).join('；')}。`:''}${spN.length||gapN.length?'<br>建議為這些項目指定補位人，或尋求外部顧問。':'<br>各項能力都有 2 位以上高分成員，覆蓋穩健。'}</div>
 <div class="cov" style="margin-top:10px">${cov.map(c=>`<div class="cv"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:8px"><h4>${TM_E(c.cap)}</h4><span class="tg ${c.st[0]}">${c.st[1]}</span></div><div class="bar" title="每格代表一位成員">${c.rows.map(r=>`<i class="${r.v===null?'':'p'+r.v}"></i>`).join('')}</div>
